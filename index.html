<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Pixel Quest - 16 bits</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #24428f, #10162f 60%);
      font-family: system-ui, sans-serif;
    }
    .wrap { text-align: center; }
    h1 { margin: 0 0 8px; font-size: 1rem; letter-spacing: .08em; }
    p { margin: 6px 0 14px; opacity: .85; }
    canvas {
      width: min(96vw, 1100px);
      height: auto;
      image-rendering: pixelated;
      border: 4px solid #f8f2d4;
      box-shadow: 0 16px 40px rgba(0,0,0,.45);
      background: #69b9ff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>SUPER PIXEL QUEST — 1 NIVEAU</h1>
    <p>Flèches / WASD: bouger • Espace: sauter • Atteins le drapeau.</p>
    <canvas id="game" width="512" height="288" aria-label="jeu 16 bits"></canvas>
  </div>
  <script type="module" src="./src/game.js"></script>
</body>
</html>
