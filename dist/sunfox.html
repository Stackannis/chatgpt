<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0916">
<title>SUNFOX — Emerald Coast</title>
<style>
  /* One-screen game: a fixed #app box holds the stage and the touch controls.
     On phones held upright the whole box is rotated 90° so the game is always played in landscape. */
  :root {
    color-scheme: dark;
    --bg: #0d0916; --ink: #1a1226; --cream: #fff8e8; --gold: #ffd630;
    --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--cream); overflow: hidden; overscroll-behavior: none;
               touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; left: 0; top: 0; width: 100%; height: 100%; box-sizing: border-box; transform-origin: 0 0; overflow: hidden;
         --pl: max(16px, var(--sal)); --pr: max(16px, var(--sar)); --pt: max(6px, var(--sat)); --pb: max(6px, var(--sab));
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
         padding-block: max(6px, env(safe-area-inset-top, 0px)) max(6px, env(safe-area-inset-bottom, 0px)); }
  /* rotated 90° clockwise: the player's left is the screen's top edge, their right is its bottom edge */
  #app.rot { --pl: max(16px, var(--sat)); --pr: max(16px, var(--sab)); --pt: max(6px, var(--sar)); --pb: max(6px, var(--sal));
             padding-left: var(--pl); padding-right: var(--pr); padding-block: var(--pt) var(--pb); }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #5cc8f8;
            box-shadow: 0 0 0 2px var(--ink), 0 8px 40px rgba(0,0,0,.6); }
  #screen.soft { image-rendering: auto; }

  .pad { position: absolute; bottom: calc(var(--pb) + 10px); display: none; gap: 14px; align-items: flex-end; z-index: 5; }
  #padL { left: var(--pl); }
  #padR { right: var(--pr); }
  .btn { width: 72px; height: 72px; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
         background: rgba(26,18,38,.38); border: 2px solid rgba(255,248,232,.55); color: rgba(255,248,232,.9);
         font: 700 15px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .08em; }
  .btn svg { width: 30px; height: 30px; fill: currentColor; }
  .btn.on { background: rgba(255,214,48,.5); border-color: var(--gold); color: var(--ink); }
  #bJump { width: 92px; height: 92px; }
  .mini { position: absolute; top: calc(var(--pt) + 4px); width: 40px; height: 40px; font-size: 13px; display: none; z-index: 5; }
  .mini svg { width: 18px; height: 18px; }
  #bPause { right: var(--pr); }
  #bRot { right: calc(var(--pr) + 48px); }
  .touch .pad, .touch .mini { display: flex; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="screen" width="384" height="216"></canvas></div>
  <div class="pad" id="padL">
    <div class="btn" id="bLeft" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M16 4 L6 12 L16 20 Z"/></svg></div>
    <div class="btn" id="bRight" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M8 4 L18 12 L8 20 Z"/></svg></div>
  </div>
  <div class="pad" id="padR"><div class="btn" id="bJump" aria-label="Jump">JUMP</div></div>
  <div class="btn mini" id="bRot" aria-label="Rotate the game"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></div>
  <div class="btn mini" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></div>
</div>
<script>
// ---- src/lib.js ----
// SUNFOX — core namespace + pixel-art helpers shared by every art module.
(function () {
  const G = (window.G = window.G || {});
  G.W = 384; // native screen width  (16:9, x5 = 1920x1080)
  G.H = 216; // native screen height
  G.T = 16; // tile size

  // Shared master palette. Ramps go dark -> light and are hue-shifted
  // (shadows drift toward purple/blue, highlights toward yellow).
  G.PAL = {
    ink: '#1a1226', // universal dark outline (never pure black)
    white: '#fff8e8',
    green: ['#0f3b2e', '#1a6b3a', '#2fa043', '#6cd13c', '#c4f25c'],
    teal: ['#0c4a4a', '#17857a', '#3cc8a8', '#a0f0d0'],
    brown: ['#2b1622', '#5a2a2a', '#8f4a2e', '#c47a3c', '#eab368', '#ffe0a0'],
    stone: ['#2a2640', '#4a4a6a', '#7a7f9c', '#b0b8cc', '#e6ecf4'],
    orange: ['#7a2414', '#c2421a', '#f07a1c', '#ffb23c', '#ffe27a'],
    red: ['#5e0f2a', '#a81c30', '#e03434', '#ff7a5a'],
    blue: ['#14204e', '#1f47a0', '#2f86e0', '#5cc8f8', '#b8f0ff'],
    purple: ['#2e1250', '#5a2a8c', '#9450c8', '#d090f0'],
    gold: ['#8a5a10', '#d49a18', '#ffd630', '#fff6a8'],
    pink: ['#b04860', '#f08a90', '#ffc8c0'],
  };

  // New canvas. `c.ctx` is its 2D context.
  G.cv = function (w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    c.ctx = c.getContext('2d');
    c.ctx.imageSmoothingEnabled = false;
    return c;
  };

  // Build a sprite from rows of characters. `pal` maps char -> '#rrggbb'.
  // '.' and ' ' are always transparent. All rows must have equal length.
  G.px = function (rows, pal) {
    const h = rows.length;
    const w = rows[0].length;
    const c = G.cv(w, h);
    for (let y = 0; y < h; y++) {
      const r = rows[y];
      if (r.length !== w) throw new Error('G.px: row ' + y + ' has length ' + r.length + ', expected ' + w + ' :: "' + r + '"');
      for (let x = 0; x < w; x++) {
        const ch = r[x];
        if (ch === '.' || ch === ' ') continue;
        const col = pal[ch];
        if (!col) throw new Error('G.px: unknown palette char "' + ch + '" at ' + x + ',' + y);
        c.ctx.fillStyle = col;
        c.ctx.fillRect(x, y, 1, 1);
      }
    }
    return c;
  };

  G.flipH = function (src) {
    const c = G.cv(src.width, src.height);
    c.ctx.translate(src.width, 0);
    c.ctx.scale(-1, 1);
    c.ctx.drawImage(src, 0, 0);
    return c;
  };

  // Copy a canvas (optionally onto a bigger canvas at an offset).
  G.copy = function (src, w, h, ox, oy) {
    const c = G.cv(w || src.width, h || src.height);
    c.ctx.drawImage(src, ox || 0, oy || 0);
    return c;
  };

  // Art registry. Each art module calls G.defineArt('name', G => ({...canvases})).
  G.art = G.art || {};
  G.defineArt = function (name, fn) {
    G.art[name] = fn(G);
  };

  // ---- Parallax backdrop (shared by the engine and the art preview tool) ----
  // B = G.art.bg. camUp = how far the camera is raised above the level's bottom (px).
  // A layer may set `raster: k` (> 1): it is then drawn in 2px strips whose scroll speed grows
  // from `speed` at its top row to `speed * k` at its bottom row — the classic line-scroll
  // trick that gives a sea or a plain fake perspective.
  G.drawBackground = function (ctx, B, camX, camUp, t) {
    if (!B) { ctx.fillStyle = '#5cc8f8'; ctx.fillRect(0, 0, G.W, G.H); return; }
    ctx.drawImage(B.sky, 0, 0);
    for (const L of B.layers) {
      const im = L.img, w = im.width;
      const y = Math.round(L.y + camUp * L.speed * 0.5);
      const drift = (L.auto || 0) * t;
      if (L.raster) {
        for (let sy = Math.max(0, -y) & ~1; sy < im.height && y + sy < G.H; sy += 2) {
          const sp = L.speed * (1 + (L.raster - 1) * (sy / im.height));
          let x = -((camX * sp + drift) % w);
          if (x > 0) x -= w;
          for (x = Math.floor(x); x < G.W; x += w) ctx.drawImage(im, 0, sy, w, 2, x, y + sy, w, 2);
        }
        continue;
      }
      let x = -((camX * L.speed + drift) % w);
      if (x > 0) x -= w;
      for (x = Math.floor(x); x < G.W; x += w) ctx.drawImage(im, x, y);
    }
  };

  // ---- Tile collision shapes (shared by engine + terrain renderer) ----
  // '#' full solid. Slopes: '/' 45deg rising to the right, '\\' 45deg falling
  // to the right, '1','2' gentle rise (two tiles), '3','4' gentle fall.
  // Returns solid height (0..16) measured from the tile's bottom at local column lx.
  G.tileH = function (ch, lx) {
    switch (ch) {
      case '#': return 16;
      case '/': return lx + 1;
      case '\\': return 16 - lx;
      case '1': return (lx >> 1) + 1;
      case '2': return (lx >> 1) + 9;
      case '3': return 16 - (lx >> 1);
      case '4': return 8 - (lx >> 1);
      default: return 0;
    }
  };
})();

</script>
<script>
// ---- src/terrain_render.js ----
// Pre-renders the level's solid terrain (dirt body, depth shading, walls,
// undersides, grass cap following slopes) into chunk canvases.
(function () {
  const G = window.G;
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const CHUNK = 512;

  function texData(cnv, fallback) {
    if (!cnv) {
      cnv = G.cv(64, 64);
      cnv.ctx.fillStyle = fallback;
      cnv.ctx.fillRect(0, 0, 64, 64);
    }
    const d = cnv.getContext('2d').getImageData(0, 0, cnv.width, cnv.height);
    return { w: cnv.width, h: cnv.height, d: new Uint32Array(d.data.buffer) };
  }

  // grid: array of equal-length strings. T: G.art.terrain (pieces may be missing).
  G.buildTerrain = function (grid, T) {
    T = T || {};
    const rows = grid.length, cols = grid[0].length;
    const W = cols * 16, H = rows * 16;
    const mask = new Uint8Array(W * H);
    for (let cy = 0; cy < rows; cy++) {
      for (let cx = 0; cx < cols; cx++) {
        const ch = grid[cy][cx];
        if (ch === ' ') continue;
        for (let lx = 0; lx < 16; lx++) {
          const h = G.tileH(ch, lx);
          for (let k = 0; k < h; k++) mask[(cy * 16 + 15 - k) * W + cx * 16 + lx] = 1;
        }
      }
    }
    const solid = (x, y) => (y < 0 ? 0 : x < 0 || x >= W || y >= H ? 1 : mask[y * W + x]);

    // Chamfer distance to nearest air pixel (3 per orthogonal step, 4 per diagonal).
    const dist = new Uint16Array(W * H);
    const INF = 60000;
    for (let i = 0; i < W * H; i++) dist[i] = mask[i] ? INF : 0;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (!dist[i]) continue;
        let d = dist[i];
        if (y === 0) d = Math.min(d, 3);
        else {
          d = Math.min(d, dist[i - W] + 3);
          if (x > 0) d = Math.min(d, dist[i - W - 1] + 4);
          if (x < W - 1) d = Math.min(d, dist[i - W + 1] + 4);
        }
        if (x > 0) d = Math.min(d, dist[i - 1] + 3);
        dist[i] = d;
      }
    }
    for (let y = H - 1; y >= 0; y--) {
      for (let x = W - 1; x >= 0; x--) {
        const i = y * W + x;
        if (!dist[i]) continue;
        let d = dist[i];
        if (y < H - 1) {
          d = Math.min(d, dist[i + W] + 3);
          if (x > 0) d = Math.min(d, dist[i + W - 1] + 4);
          if (x < W - 1) d = Math.min(d, dist[i + W + 1] + 4);
        }
        if (x < W - 1) d = Math.min(d, dist[i + 1] + 3);
        dist[i] = d;
      }
    }

    const dirt = texData(T.dirt, '#8f4a2e');
    const deep = texData(T.dirtDeep, '#5a2a2a');
    const NEAR = 50 * 3, FAR = 74 * 3; // pixels of depth where the dithered blend to dirtDeep happens

    const chunks = [];
    for (let x0 = 0; x0 < W; x0 += CHUNK) {
      const cw = Math.min(CHUNK, W - x0);
      const c = G.cv(cw, H);
      const img = c.ctx.createImageData(cw, H);
      const out = new Uint32Array(img.data.buffer);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < cw; x++) {
          const wx = x0 + x;
          const i = y * W + wx;
          if (!mask[i]) continue;
          const d = dist[i];
          let useDeep = false;
          if (d >= FAR) useDeep = true;
          else if (d > NEAR) useDeep = ((d - NEAR) / (FAR - NEAR)) * 16 > BAYER[(y & 3) * 4 + (wx & 3)] + 0.5;
          const t = useDeep ? deep : dirt;
          out[y * cw + x] = t.d[(y % t.h) * t.w + (wx % t.w)];
        }
      }
      c.ctx.putImageData(img, 0, 0);
      chunks.push(c);
    }
    // Draw helper that splats onto whichever chunk(s) a world rect touches.
    function blit(src, sx, sy, sw, sh, dx, dy) {
      const a = Math.floor(dx / CHUNK), b = Math.floor((dx + sw - 1) / CHUNK);
      for (let k = a; k <= b; k++) if (chunks[k]) chunks[k].ctx.drawImage(src, sx, sy, sw, sh, dx - k * CHUNK, dy, sw, sh);
    }
    const tileAt = (cx, cy) => (cy < 0 ? ' ' : cx < 0 || cx >= cols || cy >= rows ? '#' : grid[cy][cx]);

    // Exposed vertical faces + undersides (tile level).
    for (let cy = 0; cy < rows; cy++) {
      for (let cx = 0; cx < cols; cx++) {
        const ch = grid[cy][cx];
        if (ch === ' ' || ch === '=') continue;
        const X = cx * 16, Y = cy * 16;
        if (ch === '#') {
          for (let k = 0; k < 16; k++) {
            const y = Y + k;
            if (T.wallL && !solid(X - 1, y)) blit(T.wallL, 0, y % T.wallL.height, 8, 1, X, y);
            if (T.wallR && !solid(X + 16, y)) blit(T.wallR, 0, y % T.wallR.height, 8, 1, X + 8, y);
          }
        }
        const below = tileAt(cx, cy + 1);
        if (T.under && (below === ' ' || below === '=')) blit(T.under, X % T.under.width, 0, 16, 8, X, Y + 8);
      }
    }
    // Grass cap: one 1px column per surface pixel, so it follows any slope.
    const gr = T.grass;
    const tops = []; // [x, y] of every surface
    for (let x = 0; x < W; x++) {
      for (let y = 1; y < H; y++) {
        if (mask[y * W + x] && !mask[(y - 1) * W + x]) {
          tops.push(x, y);
          if (!gr) continue;
          let len = 0; // clip the mat to the solid body
          while (len < gr.height - 8 && y + len < H && mask[(y + len) * W + x]) len++;
          blit(gr, x % gr.width, 0, 1, 8 + len, x, y - 8);
        }
      }
    }
    for (let i = 0; i < tops.length; i += 2) {
      const x = tops[i], y = tops[i + 1];
      const openL = !solid(x - 1, y) && !solid(x - 1, y + 7) && !solid(x - 1, y + 3);
      const openR = !solid(x + 1, y) && !solid(x + 1, y + 7) && !solid(x + 1, y + 3);
      if (openL && T.grassEndL) blit(T.grassEndL, 0, 0, 8, T.grassEndL.height, x - 4, y - 8);
      if (openR && T.grassEndR) blit(T.grassEndR, 0, 0, 8, T.grassEndR.height, x - 3, y - 8);
    }

    return {
      W, H, chunks,
      draw(ctx, camX, camY) {
        const a = Math.max(0, Math.floor(camX / CHUNK)), b = Math.min(chunks.length - 1, Math.floor((camX + G.W) / CHUNK));
        for (let k = a; k <= b; k++) ctx.drawImage(chunks[k], k * CHUNK - camX, -camY);
      },
    };
  };
})();

</script>
<script>
// ---- src/art/terrain.js ----
// SUNFOX — terrain art: ground textures (composited by src/terrain_render.js),
// platforms, prize block, spring, spikes, checkpoint, goal gate, sign.
G.defineArt('terrain', G => {
  const P = G.PAL;
  const BR = P.brown, GR = P.green, ST = P.stone;

  // Shared character palette for G.px sprites.
  const C = {
    k: P.ink, w: P.white,
    0: BR[0], 1: BR[1], 2: BR[2], 3: BR[3], 4: BR[4], 5: BR[5],
    a: GR[0], b: GR[1], c: GR[2], d: GR[3], e: GR[4],
    s: ST[0], t: ST[1], u: ST[2], v: ST[3], x: ST[4],
    o: P.orange[0], p: P.orange[1], q: P.orange[2], r: P.orange[3], y: P.orange[4],
    G: P.gold[0], H: P.gold[1], I: P.gold[2], J: P.gold[3],
    R: P.red[0], S: P.red[1], T: P.red[2], U: P.red[3],
    m: P.teal[0], n: P.teal[1], M: P.teal[2], N: P.teal[3],
  };
  const px = (rows, pal) => G.px(rows, pal || C);
  const mod = (a, n) => ((a % n) + n) % n;

  // Wrapping pixel for seamless textures.
  function dot(c, x, y, col) {
    c.ctx.fillStyle = col;
    c.ctx.fillRect(mod(x, c.width), mod(y, c.height), 1, 1);
  }
  // Stamp rows of chars with a local palette ('.' = skip), wrapping.
  function stamp(c, rows, x, y, pal) {
    for (let j = 0; j < rows.length; j++)
      for (let i = 0; i < rows[j].length; i++) {
        const ch = rows[j][i];
        if (ch !== '.' && ch !== ' ') dot(c, x + i, y + j, pal[ch]);
      }
  }
  function R(c, x, y, w, h, col) { c.ctx.fillStyle = col; c.ctx.fillRect(x, y, w, h); }

  // ------------------------------------------------------------------
  // EARTH — layered rock strata (64x64 seamless)
  // Four strata of uneven height (tall / thin / medium / thin). Every seam
  // has its own wave so no row lines up with the next; each stratum is
  // cracked into slabs with a lit top-left corner and a shaded bottom-right.
  // A boulder cluster, a root, a pebble group and a wedged stone are embedded
  // so the eye never finds the 64px grid. `dirtDeep` is the very same pixel
  // map drawn with a ramp one step darker and more purple (no highlights).
  // ------------------------------------------------------------------
  // ramp index:       0 seam     1 crack    2 dk shade 3 shade    4 base B   5 base A   6 light    7 hilite   8 glint
  const DIRT_RAMP = ['#5a2a2a', '#73372b', '#8a4532', '#a9602f', '#b26736', '#c47a3c', '#d8944c', '#eab368', '#ffe0a0'];
  // exactly one step down dirt's own ramp (each tone = dirt's next darker tone, nudged purple),
  // so the engine's ordered dither between the two reads as a soft tonal band
  const DEEP_RAMP = ['#4c2230', '#5c2a2e', '#74372f', '#8b4634', '#a05a32', '#b26736', '#c47a3c', '#d48e4a', '#d48e4a'];
  const DI = { k: 0, D: 1, d: 2, s: 3, n: 4, m: 5, L: 6, H: 7, W: 8 };
  // 64-long seam profile from [length, step] runs: the seam moves 1px down (step > 0)
  // or up (step < 0) every |step| px, or stays flat (step 0).
  function prof(segs) {
    const a = []; let y = 0;
    for (const [len, step] of segs)
      for (let i = 0; i < len; i++) { if (step && i % Math.abs(step) === 0) y += Math.sign(step); a.push(y); }
    if (a.length !== 64 || y !== 0) throw new Error('seam profile: length ' + a.length + ', ends at ' + y);
    return a;
  }
  const SEAM_Y = [0, 23, 33, 51];
  const SEAM = [
    prof([[10, 0], [12, 3], [14, 0], [8, -2], [20, 0]]),
    prof([[24, 0], [12, 4], [10, 0], [6, -2], [12, 0]]),
    prof([[6, 0], [8, -4], [10, 0], [8, 4], [4, 0], [8, 4], [12, 0], [8, -4]]),
    prof([[8, 0], [9, 3], [14, 0], [6, -2], [11, 0], [8, -4], [4, 0], [4, 2]]),
  ];
  const CRACK = [                                   // per stratum: [x at the top, lean in px]
    [[9, 4], [30, -5], [55, 3]],
    [[19, 2], [45, -3]],
    [[6, -4], [27, 5], [46, -3]],
    [[16, 3], [50, -2]],
  ];
  const BASE = [5, 4, 5, 4];                         // base tone of each stratum
  function dirtIndex(x, y) {
    const s0 = SEAM_Y[0] + SEAM[0][x];
    const yy = y < s0 ? y + 64 : y;
    let k = 3;
    while (k > 0 && yy < SEAM_Y[k] + SEAM[k][x]) k--;
    const top = SEAM_Y[k] + SEAM[k][x];
    const bot = k === 3 ? s0 + 64 : SEAM_Y[k + 1] + SEAM[k + 1][x];
    if (yy === top) return DI.k;
    const h = bot - top - 1, dt = yy - top - 1, db = bot - 1 - yy;
    let dl = 99, dr = 99;
    for (const [x0, lean] of CRACK[k]) {
      const cx = x0 + Math.round(lean * (dt + 0.5) / h);
      const a = mod(x - cx, 64), b = mod(cx - x, 64);
      if (a === 0) return DI.D;
      dl = Math.min(dl, a - 1); dr = Math.min(dr, b - 1);
    }
    const w = dl + dr + 1, base = BASE[k], tall = h >= 13, wide = w >= 16;
    // a lit ledge along the top (thick at the left, tapering right) + lit left end,
    // a shaded wedge along the bottom-right, dark purple-brown just above the seam
    if (dt <= 1 && dl <= 1) return DI.H;
    if (db + dr <= 2) return DI.d;
    if (dt === 0) return dl < w * 0.62 ? DI.H : DI.L;

        if (q() < 0.5) { const a2 = ang + (q() - 0.5) * 1.2, rt = 2.4 + q() * 1.2; list.push({ x: bx + Math.cos(a2) * rb * 0.9, y: by - Math.sin(a2) * rb * 0.8, rx: rt * 1.2, ry: rt, g, set: bs }); }
        list.push({ x: bx, y: by, rx: rb * 1.15, ry: rb, g, set: bs });
      }
      list.push({ x, y, rx: a, ry: b, g, set: s, sh, lc: simple ? 0 : clamp(Math.round(b * 0.2), 2, 5) });
      // a few leaf clusters on its face
      if (simple) return;
      for (let m = Math.round((a * b) / (s === dark ? 420 : 210)); m > 0; m--) {
        const r = 4.5 + q() * 5, u = -0.62 + q() * 1.1, v = -0.3 + q() * 0.85;
        if (u * u + v * v < 0.72) list.push({ x: x + u * a, y: y + v * b, rx: r * 1.3, ry: r * 0.8, g, set: s });
      }
    };
    if (simple) return lobe(cx, cy, rx, ry, set);
    lobe(cx + (q() - 0.5) * rx * 0.2, cy, rx * 0.74, ry, set, Math.round(ry * 0.55));
    lobe(cx - rx * 0.52, cy + ry * (0.15 + q() * 0.25), rx * 0.48, ry * (0.6 + q() * 0.14), set);
    lobe(cx + rx * 0.5, cy + ry * (0.2 + q() * 0.3), rx * 0.5, ry * (0.58 + q() * 0.14), dark);
    list.push({ x: cx - rx * (0.05 + q() * 0.2), y: cy + ry * 0.4, rx: rx * 0.3, ry: rx * 0.19, g, set });
  }

  // Palm fronds per crown shape: [start angle, length factor, bend (deg, toward the ground;
  // negative = blown back over the crown), depth 0 back .. 2 front].
  const FROND = {
    arch: [[200, 0.75, 45, 0], [-20, 0.75, 45, 0], [165, 1, 75, 1], [15, 1, 75, 1], [128, 1, 85, 2], [52, 1, 85, 2], [98, 0.6, 45, 2], [76, 0.55, 50, 1]],
    droop: [[195, 0.8, 60, 0], [-15, 0.8, 60, 0], [158, 1, 100, 1], [22, 1, 100, 1], [122, 0.95, 118, 2], [58, 0.95, 118, 2], [92, 0.5, 60, 2]],
    wind: [[168, 0.5, -30, 0], [142, 0.8, -70, 1], [112, 0.9, -80, 2], [84, 1, 70, 2], [52, 1.1, 55, 2], [24, 1.15, 40, 1], [-8, 0.9, 35, 0]],
    fan: [[186, 0.7, 35, 0], [-6, 0.7, 35, 0], [156, 0.95, 45, 1], [24, 0.95, 45, 1], [126, 1, 40, 2], [54, 1, 40, 2], [92, 0.85, 12, 2]],
  };
  function frond(L, x0, y0, a0, len, bend, cs, cl, R) {
    const sign = a0 > 90 && a0 < 270 ? 1 : -1, lmax = Math.max(2, R * 0.2);
    let fx = x0 + 0.5, fy = y0 + 0.5, lx = 1e9, ly = 1e9;
    for (let d = 0; d <= len; d += 0.25) {
      const s = d / len, ang = ((a0 + sign * bend * Math.pow(s, 1.4)) * Math.PI) / 180;
      fx += Math.cos(ang) * 0.25; fy -= Math.sin(ang) * 0.25;
      const px = Math.floor(fx), py = Math.floor(fy);
      if (px === lx && py === ly) continue;
      const prof = Math.pow(Math.sin(Math.PI * Math.min(1, 0.12 + s * 0.88)), 0.7);
      if (px !== lx) {
        let ll = Math.round(lmax * prof * Math.sqrt(Math.abs(Math.cos(ang))));
        if ((px & 1) && ll > 1) ll--;
        for (let k = 1; k <= ll; k++) L.set(px, py + k, cl);
      } else if (prof > 0.4) L.set(px + (py & 1 ? 1 : -1), py, cl);
      L.set(px, py, cs);
      lx = px; ly = py;
    }
  }
  // Palm: a 2px trunk (light left, dark right) on a smooth curve, rising h px from (x, y).
  function palm(L, x, y, h, lean, R, kind, c, flip) {
    let tx = x;
    for (let i = 0; i <= h; i++) {
      tx = x + Math.round(lean * (i / h) * (i / h));
      L.set(tx, y - i, c.tl); L.set(tx + 1, y - i, c.td);
    }
    const ty = y - h;
    for (const [a, lf, bend, lay] of FROND[kind]) frond(L, tx + (flip ? 1 : 0), ty, flip ? 180 - a : a, R * lf, bend, c.f[lay][0], c.f[lay][1], R);
    L.row(tx - 1, tx + 2, ty + 1, c.td); L.row(tx, tx + 1, ty + 2, c.td);
  }

  function makeJungle() {
    const L = layer(768, 128), TAU = Math.PI * 2;
    const SETS = { A: [JA[0], JA[1], JA[1], JA[2], JA[2]], H: [J[3], J[3], J[3], J[4], J[4]], B: J, S: [J[2], J[3], J[3], J[4], J[4]] };
    const PN = { tl: C('#8eaca4'), td: C('#4f747e'), f: [[J[3], J[4]], [J[2], J[3]], [J[1], J[3]]] };
    const PF = { tl: C('#96b4ac'), td: C('#5f8a92'), f: [[JA[2], C('#5a9698')], [JA[1], JA[2]], [JA[1], C('#5a9698')]] };
    const back = x => 51 + 4 * Math.sin((x / 768) * TAU * 3 + 1) + 2 * Math.sin((x / 768) * TAU * 7);
    const q = rng(77);
    // far treeline (hazier, flatter)
    for (let x = 0; x < 768; x++) L.col(x, Math.round(back(x)) + 5, L.h - 1, JA[2]);
    const rowA = [];
    for (let i = 0; i < 30; i++) {
      const cx = (i + 0.5 + (q() - 0.5) * 0.5) * (768 / 30), rx = 11 + q() * 10;
      crown(rowA, i, 'A', 'A', cx, back(cx) - 2 + q() * 5, rx, rx * 0.62, q, true);
    }
    foliage(L, rowA, SETS);
    // palms: [x, base y, height, lean, frond radius, shape, flip, far?] — two tall heroes, small clusters
    for (const [x, y, h, lean, R, kind, flip, far] of [
      [116, 72, 60, 7, 21, 'arch', 0, 0], [508, 72, 54, -6, 20, 'wind', 1, 0],
      [226, 74, 30, -4, 11, 'droop', 0, 1], [246, 74, 42, 3, 14, 'arch', 1, 0], [262, 74, 24, 4, 9, 'fan', 0, 1],
      [322, 72, 28, -3, 10, 'wind', 1, 1], [344, 72, 40, 5, 13, 'droop', 0, 0],
      [600, 76, 44, 5, 15, 'fan', 0, 0], [668, 76, 34, -5, 12, 'wind', 0, 0], [690, 76, 26, 3, 9, 'droop', 0, 1],
      [748, 72, 36, 4, 12, 'arch', 0, 0], [764, 72, 26, -3, 9, 'fan', 1, 1],
    ]) palm(L, x, y, h, lean, R, kind, far ? PF : PN, flip);
    // dark hollows behind the main crowns
    const hol = x => back(x) + 13 + 2 * Math.sin((x / 768) * TAU * 11);
    for (let x = 0; x < 768; x++) L.col(x, Math.round(hol(x)) + 4, L.h - 1, J[4]);
    const rowH = [];
    for (let i = 0; i < 26; i++) { const cx = (i + 0.5 + (q() - 0.5) * 0.4) * (768 / 26), rx = 13 + q() * 8; rowH.push({ x: cx, y: hol(cx) + rx * 0.5, rx, ry: rx * 0.6, g: i, set: 'H' }); }
    foliage(L, rowH, SETS);
    // main crowns [cx, top, rx, ry], taller ones behind
    const rowB = [];
    [[34, 52, 40, 24], [98, 42, 26, 20], [150, 44, 44, 28], [214, 58, 24, 16], [268, 62, 40, 20], [334, 56, 28, 20],
      [396, 42, 46, 30], [462, 36, 26, 22], [516, 48, 38, 24], [580, 60, 26, 16], [640, 64, 44, 20], [716, 54, 36, 24]]
      .map((c, i) => [c, i]).sort((a, b) => a[0][1] - b[0][1]).forEach(([c, i]) => crown(rowB, 100 + i, 'B', 'S', c[0], c[1], c[2], c[3], q));
    foliage(L, rowB, SETS);
    // nearer, darker understory, then everything sinks into one quiet tone
    const und = x => 80 + 3 * Math.sin((x / 768) * TAU * 5 + 2);
    for (let x = 0; x < 768; x++) L.col(x, Math.round(und(x)) + 6, L.h - 1, J[4]);
    const rowC = [];
    for (let i = 0; i < 20; i++) {
      const cx = (i + 0.5 + (q() - 0.5) * 0.5) * (768 / 20), rx = 20 + q() * 12;
      crown(rowC, 200 + i, 'S', 'S', cx, und(cx) - 5 + q() * 6, rx, rx * 0.5, q);
    }
    foliage(L, rowC, SETS);
    const FADE = [3, 6, 10, 13];
    for (let x = 0; x < L.w; x++) {
      const y0 = Math.round(89 + 2.5 * Math.sin((x / 768) * TAU * 9) + 1.5 * Math.sin((x / 768) * TAU * 23 + 2));
      for (let y = y0; y < L.h; y++) { const k = y - y0, f = k < FADE.length ? FADE[k] / 16 : 1; if (L.d[y * L.w + x] && f > d4(x, y)) L.d[y * L.w + x] = J[4]; }
    }
    return L;
  }

  // ===================== assemble =====================
  return {
    sky: bake(makeSky()),
    layers: [
      { img: bake(makeBank()), y: 20, speed: 0.02, auto: 1 },
      { img: bake(makeFloaters()), y: 4, speed: 0.04, auto: 2.5 },
      { img: bake(makeSeaFar()), y: 108 - HZ, speed: 0.06 },
      { img: bake(makeSeaNear()), y: 120, speed: 0.11, raster: 5 },
      { img: bake(makeLagoon()), y: 130, speed: 0.22, raster: 2.6 },
      { img: bake(makeIsles()), y: 130 - WL, speed: 0.22 },
      { img: bake(makeJungle()), y: 90, speed: 0.45 },
    ],
  };
});

<script>
// ---- src/art/player.js ----
// SUNFOX — Kit the fox (player sprites).
// Every frame is 32x32, facing right, feet on the bottom row, body axis on x=16.
// Kit is authored as hand-pixelled PARTS (head, torso, limbs, tail, scarf ribbon) in canvas
// coordinates; frames are composed from parts with integer offsets so volumes stay consistent
// between frames, then a "selout" pass tints the sun-facing outline with dark local colour.
G.defineArt('player', G => {
  'use strict';
  const P = G.PAL;
  const C = {
    k: P.ink, K: P.ink,                       // k = outline (may be tinted by selout), K = features (never tinted)
    o: P.orange[0], r: P.orange[1], O: P.orange[2], y: P.orange[3], Y: P.orange[4],
    w: P.white, c: P.brown[5], s: P.brown[4], u: P.brown[3],
    D: P.brown[0], d: P.brown[1], b: P.brown[2],  // dark "socks", paws, ear tips
    g: P.teal[0], t: P.teal[1], T: P.teal[2], h: P.teal[3],
    p: P.pink[1], q: P.pink[0],
  };
  const W = 32, H = 32;

  // ---------------------------------------------------------------- char-buffer toolkit
  const blank = () => Array.from({ length: H }, () => new Array(W).fill('.'));
  // A part is [firstRow, 'row', 'row', ...] in canvas coordinates ('.' transparent, '_' erases).
  function put(buf, part, dx, dy, map) {
    dx = dx || 0; dy = dy || 0;
    for (let j = 1; j < part.length; j++) {
      const row = part[j], y = part[0] + j - 1 + dy;
      if (y < 0 || y >= H) continue;
      for (let x = 0; x < row.length; x++) {
        const ch = row[x];
        if (ch === '.' || ch === ' ') continue;
        const X = x + dx;
        if (X < 0 || X >= W) continue;
        buf[y][X] = ch === '_' ? '.' : (map && map[ch]) || ch;
      }
    }
    return buf;
  }
  // Copy of a part with some canvas rows replaced: patch(part, {10: 'newrow', ...}).
  function patch(part, rows) {
    const p = part.slice();
    for (const k in rows) p[+k - part[0] + 1] = rows[k];
    return p;
  }
  // Selective outline: outline pixels on the sun side (upper-left) take a dark shade of the
  // material they wrap instead of ink.
  const MAT = {};
  'orOyY'.split('').forEach(ch => (MAT[ch] = 'o'));
  'wcsubd'.split('').forEach(ch => (MAT[ch] = 'd'));
  'gtTh'.split('').forEach(ch => (MAT[ch] = 'g'));
  function selout(buf) {
    const at = (x, y) => (x < 0 || y < 0 || x >= W || y >= H ? '.' : buf[y][x]);
    const out = buf.map(r => r.slice());
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (buf[y][x] !== 'k') continue;
      let nx = 0, ny = 0, edge = false;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if ((dx || dy) && at(x + dx, y + dy) === '.') { nx += dx; ny += dy; if (!dx || !dy) edge = true; }
      }
      if (!edge || -nx - ny <= 0) continue;
      const votes = {};
      for (const [dx, dy, wgt] of [[1, 0, 2], [0, 1, 2], [-1, 0, 2], [0, -1, 2], [1, 1, 1]]) {
        const m = MAT[at(x + dx, y + dy)];
        if (m) votes[m] = (votes[m] || 0) + wgt;
      }
      let best = null, bv = 0;
      for (const m in votes) if (votes[m] > bv) { bv = votes[m]; best = m; }
      if (best) out[y][x] = best;
    }
    return out;
  }
  const render = buf => G.px(selout(buf).map(r => r.join('')), C);
  const frame = (...layers) => {
    const b = blank();
    for (const L of layers) if (L) put(b, L[0], L[1], L[2], L[3]);
    return render(b);
  };

  // ---------------------------------------------------------------- procedural part layers
  // Limbs, tail, torso and scarf are built as small layers from joints (so every pose is a real,
  // distinct pose with consistent volumes), form-shaded from the upper left, outlined, then stacked.
  const RAMP = { O: ['y', 'O', 'r'], c: ['w', 'c', 's'], b: ['u', 'b', 'd'], r: ['O', 'r', 'o'], d: ['b', 'd', 'D'] };
  const set = (L, x, y, ch) => { if (x >= 0 && y >= 0 && x < W && y < H) L[y][x] = ch; };
  function disc(L, cx, cy, r, ch) {
    for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
      for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++)
        if ((x - cx) * (x - cx) + (y - cy) * (y - cy) <= r * r + 0.05) set(L, x, y, ch);
  }
  const steps = (a, b) => Math.ceil(Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1]))) * 2 + 1;
  function cap(L, a, b, ra, rb, ch) {            // tapered capsule
    const n = steps(a, b);
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      disc(L, a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, ra + (rb - ra) * t, typeof ch === 'function' ? ch(t) : ch);
    }
  }
  function sq(L, a, b, ch) {                     // 2px-thick stroke (top-left anchored)
    const n = steps(a, b);
    for (let i = 0; i <= n; i++) {
      const t = i / n, x = Math.round(a[0] + (b[0] - a[0]) * t), y = Math.round(a[1] + (b[1] - a[1]) * t);
      const c = typeof ch === 'function' ? ch(t) : ch;
      set(L, x, y, c); set(L, x + 1, y, c); set(L, x, y + 1, c); set(L, x + 1, y + 1, c);
    }
  }
  function shade(L, depth) {
    const e = (x, y) => x < 0 || y < 0 || x >= W || y >= H || L[y][x] === '.';
    const out = L.map(r => r.slice());
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const R = RAMP[L[y][x]];
      if (!R) continue;
      const dark = e(x + 1, y) || e(x, y + 1) || (depth > 1 && (e(x + 1, y + 1) || e(x, y + 2)));
      const lit = e(x - 1, y) || e(x, y - 1) || (depth > 1 && (e(x - 1, y - 1) || e(x, y - 2)));
      out[y][x] = lit && !(dark && !e(x, y - 1) && !e(x - 1, y)) ? R[0] : dark ? R[2] : R[1];
    }
    return out;
  }
  // Thin limbs: flat colour, one shadow edge underneath (and a light top edge on socks / mitts only).
  const FLAT = { O: ['O', 'O', 'r'], b: ['u', 'b', 'd'], r: ['r', 'r', 'o'], d: ['d', 'd', 'D'] };
  function shadeFlat(L) {
    const e = (x, y) => x < 0 || y < 0 || x >= W || y >= H || L[y][x] === '.';
    const out = L.map(r => r.slice());
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const R = FLAT[L[y][x]];
      if (!R) continue;
      out[y][x] = e(x, y - 1) ? R[0] : e(x, y + 1) || (e(x + 1, y) && !e(x - 1, y)) ? R[2] : R[1];
    }
    return out;
  }
  function outl(L, ch) {
    const f = (x, y) => x >= 0 && y >= 0 && x < W && y < H && L[y][x] !== '.';
    const out = L.map(r => r.slice());
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
      if (L[y][x] === '.' && (f(x - 1, y) || f(x + 1, y) || f(x, y - 1) || f(x, y + 1))) out[y][x] = ch || 'k';
    return { L: out };
  }
  const add = (p, d) => [p[0] + d[0], p[1] + d[1]];

  // leg = [hip, knee, ankle, footVector]; the lower shin and the foot are the dark "sock".
  function leg(p, far) {
    const L = blank(), fur = far ? 'r' : 'O', sock = far ? 'd' : 'b';
    cap(L, p[0], p[1], 1.5, 1.3, fur);
    sq(L, p[1], p[2], t => (t < 0.3 ? fur : sock));
    const toe = add(p[2], p[3]);
    sq(L, p[2], toe, sock);
    const S = shadeFlat(L);
    const tx = Math.round(toe[0]), ty = Math.round(toe[1]), fx = p[3][0] >= 0 ? 1 : 0;
    set(S, tx + fx, ty, far ? 'b' : 's');                      // lighter toe cap
    if (!far) set(S, tx + 1 - fx, ty, 'u');
    return outl(S);
  }
  // arm = [shoulder, elbow, hand]: orange sleeve of fur, round brown mitt.
  function arm(p, far) {
    const L = blank(), fur = far ? 'r' : 'O', paw = far ? 'd' : 'b';
    sq(L, p[0], p[1], fur); sq(L, p[1], p[2], fur);
    disc(L, p[2][0] + 0.5, p[2][1] + 0.5, 1.6, paw);
    return outl(shadeFlat(L));
  }
  // tail = spine points + radii; the last third is the cream tip.
  function tail(pts, rs, cream) {
    const L = blank(), n = pts.length - 1;
    cream = cream || 0.7;
    for (let s = 0; s < n; s++) cap(L, pts[s], pts[s + 1], rs[s], rs[s + 1], t => ((s + t) / n > cream ? 'c' : 'O'));
    return outl(shade(L, 2));
  }
  // scarf ribbon: 2-segment streamer (3 points), light upper edge, dark-teal outline.
  function ribbon(pts) {
    const L = blank();
    for (let s = 0; s < pts.length - 1; s++) sq(L, pts[s], pts[s + 1], 'T');
    const e = (x, y) => x < 0 || y < 0 || x >= W || y >= H || L[y][x] === '.';
    const S = L.map(r => r.slice());
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
      if (L[y][x] === 'T') S[y][x] = e(x, y + 1) || (e(x + 1, y) && !e(x, y - 1)) ? 't' : 'T';
    const last = pts[pts.length - 1];
    set(S, Math.round(last[0]), Math.round(last[1]), 'h');
    return outl(S, 'g');
  }
  // torso capsule (neck -> hips) with the cream belly on its front side.
  function torso(n, h, r) {
    const L = blank();
    r = r || 3.5;
    const dx = h[0] - n[0], dy = h[1] - n[1], len = Math.hypot(dx, dy) || 1, f = [dy / len, -dx / len];
    cap(L, n, h, r, r, 'O');
    cap(L, [n[0] + f[0] * 1.7, n[1] + f[1] * 1.7], [h[0] + f[0] * 1.7, h[1] + f[1] * 1.7], r - 1.7, r - 1.7, 'c');
    return outl(shade(L, 2));
  }
  // scarf neck band between two points (3px tall).
  function band(a, b) {
    const L = blank(), n = steps(a, b);
    for (let i = 0; i <= n; i++) {
      const t = i / n, x = Math.round(a[0] + (b[0] - a[0]) * t), y = Math.round(a[1] + (b[1] - a[1]) * t);
      set(L, x, y - 1, t < 0.3 ? 'h' : 'T'); set(L, x, y, t > 0.6 ? 't' : 'T'); set(L, x, y + 1, 't');
    }
    return outl(L, 'g');
  }
  function build(parts) {
    const b = blank();
    for (const p of parts) {
      if (!p) continue;
      if (p.L) { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (p.L[y][x] !== '.') b[y][x] = p.L[y][x]; }
      else put(b, p[0], p[1], p[2], p[3]);
    }
    return render(b);
  }
  // Full procedural pose. o: head [part,dx,dy], tn/th torso neck+hip, bd band [a,b], tail [pts,rs],
  // rib points, aN/aF arms, lN/lF legs.
  function kit(o) {
    return build([
      o.tail && tail(o.tail[0], o.tail[1], o.tail[2]), o.rib && ribbon(o.rib),
      o.aF && arm(o.aF, true), o.lF && leg(o.lF, true),
      torso(o.tn, o.th, o.tr), o.bd && band(o.bd[0], o.bd[1]),
      o.lN && leg(o.lN), o.head, o.aN && arm(o.aN), o.over,
    ]);
  }

  // ---------------------------------------------------------------- HEAD (the master part)
  const HEAD = [1,
    '............k',
    '...........kDk........k',
    '...........kDDk......kDk',
    '..........kDddk.....kDdk',
    '..........kOqpOk...kOqOOk',

  const sHead = px(HEAD, SP);
  const HEADB = HEAD.slice();
  HEADB[3] = 'klpppmpk'; HEADB[4] = 'kkkkkppk'; HEADB[5] = 'klwkwppk';
  const sHeadLow = px(HEADB, SP); // lid sagging even lower

    '.kmpk',

  ];

  // ------------------------------------------------------------------- FLYER

  const FP = {

    w: '#fff4cc', s: '#ffd060', t: '#e89038',
    i: P.white, g: ST[3],
    W: P.white, K: P.ink,

  const fBody = px([
    '........kkkkk........',
    '......kkcccbbkk......',
    '.....kcCCcbbbbbk.....',
    '.....kcCckkbbbbbk....',
    '....kkckkKWkbbbbBk...',
    '..kkiicWKKWkbbbbBBk..',
    'kkiiggckkkbbbbbbBBk..',
    '.kkkkkkYYcbbbbbBBBnk.',
    '......kyYwwbbbBBBBnk.',
    '.......kwwwwbbBBBnnk.',
    '.......kwwwwsBBBnnnk.',
    '........kwwssBBnnnk..',

  ], FP);
  const fTail = px([
    'kkk...',
    'kBBkk.',
    '.kBBBk',
    '.kBnk.',

    '...kk.',
  ], FP);
  const fWU = px([
    '.....kkk.',

    '.kBnk.',
    '.kBnk.',
    'kBBnk.',
    'kBBnnk',
    'kBBnnk',
    'kBBBnk',

  ], FP);
  const fWM = px([
    '...kkkkkk.',

  const fWM2 = px([

  const fWD = px([
    'kkkk....',

    '.kcbbBnk',

  const fly = [

  return {

<script>
// ---- src/art/items.js ----
// SUNFOX — items: collectibles, effects, HUD icons, 8px bitmap font, title logo.
//   gem      6 x 16x16  sun-shard crystal (flat rhombic shard spinning about its vertical axis)
//   bigCoin  6 x 24x24  star medallion (gold rim, emerald enamel, raised star)
//   heart    2 x 16x16  · sparkle 4 x 16x16 · dust 4 x 16x16 · poof 5 x 24x24 · splash 5 x 32x24
//   hud      {heart, heartEmpty, gem, coinOn, coinOff} 16x16 (coinOff = empty medal socket)
//   font     char -> 8px tall glyph (outline baked in)
//   logo     250x80 "SUNFOX" wordmark: bevelled banded letters, extruded shadow, sun crown, fox-tail swash
// Everything is authored on small indexed buffers: hand-pixelled stamps plus integer-only
// construction (no anti-aliasing anywhere). Light comes from the upper-left.
// FX anchoring (how the engine draws them): sparkle / poof / gem / coin / heart are centred in
// their frame, splash is bottom-aligned, dust has its ground line on row 8 (frame centre).
G.defineArt('items', G => {
  'use strict';
  const P = G.PAL;
  const INK = P.ink, WHT = P.white;
  const OR = P.orange, GO = P.gold, RD = P.red, BL = P.blue, TE = P.teal, ST = P.stone,
    BR = P.brown, PU = P.purple, PK = P.pink;

  // ------------------------------------------------------------ pixel buffers
  function B(w, h) { return { w, h, d: new Array(w * h).fill(null) }; }
  function S(b, x, y, c) { if (x >= 0 && y >= 0 && x < b.w && y < b.h) b.d[y * b.w + x] = c; }
  function Gt(b, x, y) { return x >= 0 && y >= 0 && x < b.w && y < b.h ? b.d[y * b.w + x] : null; }
  function out(b) {
    const c = G.cv(b.w, b.h);
    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
      const v = b.d[y * b.w + x];
      if (v) { c.ctx.fillStyle = v; c.ctx.fillRect(x, y, 1, 1); }
    }
    return c;
  }
  // Shared character palette for hand-pixelled rows.
  const C = {
    k: INK, w: WHT,
    r: OR[0], o: OR[1], O: OR[2], g: OR[3], y: GO[2], l: GO[3],
    D: GO[0], G: GO[1],
    1: RD[0], 2: RD[1], 3: RD[2], 4: RD[3], p: PK[1], P: PK[2],
    t: TE[0], T: TE[1], M: TE[2], N: TE[3],
    a: BL[0], b: BL[1], c: BL[2], d: BL[3], e: BL[4],
    s: ST[0], S: ST[1], u: ST[2], v: ST[3], x: ST[4],
    5: BR[0], 6: BR[1], 7: BR[2], 8: BR[3], 9: BR[4], 0: BR[5],
    q: PU[0], Q: PU[1], z: PU[2], Z: PU[3],
  };
  function stamp(b, rows, ox, oy, pal) {
    pal = pal || C;
    for (let y = 0; y < rows.length; y++) {
      const r = rows[y];
      for (let x = 0; x < r.length; x++) {
        const ch = r[x];
        if (ch === '.' || ch === ' ') continue;
        if (!pal[ch]) throw new Error('items: unknown palette char "' + ch + '"');
        S(b, ox + x, oy + y, pal[ch]);
      }
    }
  }
  const px = (rows, pal) => G.px(rows, pal || C);
  // 1px outline around every opaque pixel (4-neighbour, or 8-neighbour with diag).
  function outline(b, col, diag) {
    const src = b.d.slice();
    const has = (x, y) => x >= 0 && y >= 0 && x < b.w && y < b.h && src[y * b.w + x];
    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
      if (src[y * b.w + x]) continue;
      if (has(x - 1, y) || has(x + 1, y) || has(x, y - 1) || has(x, y + 1) ||
        (diag && (has(x - 1, y - 1) || has(x + 1, y - 1) || has(x - 1, y + 1) || has(x + 1, y + 1)))) b.d[y * b.w + x] = col;
    }
  }
  // Clean pixel discs: row widths for a given diameter.
  function discRows(d) {
    if (d === 3) return [1, 3, 1];
    const r = d / 2, rows = [];
    for (let y = 0; y < d; y++) {
      let n = 0;
      for (let x = 0; x < d; x++) if ((x + 0.5 - r) * (x + 0.5 - r) + (y + 0.5 - r) * (y + 0.5 - r) <= r * r) n++;
      rows.push(n);
    }
    return rows;
  }
  function disc(b, x0, y0, d, col, clip) {
    const rows = discRows(d);
    for (let y = 0; y < d; y++) {
      const w = rows[y], s = (d - w) >> 1;
      for (let i = 0; i < w; i++) if (!clip || clip(x0 + s + i, y0 + y)) S(b, x0 + s + i, y0 + y, col);
    }
  }

  // Body rows -> canvas with a 1px ink outline added around the silhouette.
  function spr(rows, edge, pal) {
    const b = B(rows[0].length, rows.length);
    stamp(b, rows, 0, 0, pal);
    outline(b, edge || INK);
    return out(b);
  }

  // ==================================================================== GEM
  // Sun shard: a four-pointed crystal star, two shallow pyramids back to back. It is a real little
  // solid (4 tips, 4 notch corners, front + back apex) turned about its vertical axis in 30 degree
  // steps and flat-shaded per facet with a fixed upper-left light, so the ridge and the light / dark
  // facet split travel across the shard as it spins and the far side swings in from the left.
  const GEMR = [OR[0], OR[1], OR[2], OR[3], GO[2], GO[3], WHT];
  const gem = [0, 1, 2, 3, 4, 5].map(f => {
    const a = f * Math.PI / 6, ca = Math.cos(a), sa = Math.sin(a), TIP = 7.8, IN = 3, DP = 3.4;
    const rot = p => [p[0] * ca + p[2] * sa, p[1], -p[0] * sa + p[2] * ca];
    const tips = [[0, -TIP, 0], [TIP, 0, 0], [0, TIP, 0], [-TIP, 0, 0]];
    const inn = [[IN, -IN, 0], [IN, IN, 0], [-IN, IN, 0], [-IN, -IN, 0]];
    const tris = [];
    [[0, 0, DP], [0, 0, -DP]].forEach(ap => {
      for (let i = 0; i < 4; i++) { tris.push([ap, tips[i], inn[i]]); tris.push([ap, inn[i], tips[(i + 1) % 4]]); }
    });
    const L = [-0.52, -0.62, 0.59];
    const b = B(16, 16);
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const px = x + .5 - 8, py = y + .5 - 8;
      let bz = -1e9, bc = null;
      tris.forEach(t => {
        const A = rot(t[0]), Bv = rot(t[1]), Cv = rot(t[2]);
        const d = (Bv[1] - Cv[1]) * (A[0] - Cv[0]) + (Cv[0] - Bv[0]) * (A[1] - Cv[1]);
        if (Math.abs(d) < 1e-6) return;
        const u = ((Bv[1] - Cv[1]) * (px - Cv[0]) + (Cv[0] - Bv[0]) * (py - Cv[1])) / d;
        const v = ((Cv[1] - A[1]) * (px - Cv[0]) + (A[0] - Cv[0]) * (py - Cv[1])) / d, w = 1 - u - v;
        if (u < -1e-4 || v < -1e-4 || w < -1e-4) return;
        const z = u * A[2] + v * Bv[2] + w * Cv[2];
        if (z <= bz) return;
        let n = [(Bv[1] - A[1]) * (Cv[2] - A[2]) - (Bv[2] - A[2]) * (Cv[1] - A[1]), (Bv[2] - A[2]) * (Cv[0] - A[0]) - (Bv[0] - A[0]) * (Cv[2] - A[2]), (Bv[0] - A[0]) * (Cv[1] - A[1]) - (Bv[1] - A[1]) * (Cv[0] - A[0])];
        const nl = Math.hypot(n[0], n[1], n[2]) * (n[2] < 0 ? -1 : 1);
        const li = (n[0] * L[0] + n[1] * L[1] + n[2] * L[2]) / nl;
        bz = z; bc = GEMR[Math.max(0, Math.min(6, Math.floor((li + 0.42) * 5.2)))];
      });
      if (bc) S(b, x, y, bc);
    }
    // sliver facets leave lone pixels: fold each into the neighbouring cluster it touches most
    for (let pass = 0; pass < 2; pass++) for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const c = Gt(b, x, y);
      if (!c) continue;
      const nb = [Gt(b, x - 1, y), Gt(b, x + 1, y), Gt(b, x, y - 1), Gt(b, x, y + 1)].filter(v => v);
      if (nb.indexOf(c) >= 0 || !nb.length) continue;
      const best = nb.slice().sort((p, q) => nb.filter(v => v === q).length - nb.filter(v => v === p).length)[0];
      S(b, x, y, best);
    }
    outline(b, INK);
    return out(b);
  });

  // ================================================================== HEART
  const heartA = [
    '................',
    '................',
    '...kkk....kkk...',
    '..k444k..k333k..',
    '.k4wP43kk33332k.',
    '.k4P4333333332k.',
    '.k443333333322k.',
    '.k333333333322k.',
    '..k3333333322k..',
    '...k33333322k...',
    '....k333322k....',
    '.....k3221k.....',
    '......k21k......',
    '.......kk.......',
    '................',
    '................',
  ];
  const heartB = [
    '................',
    '...kkkk..kkkk...',
    '..k4444kk3333k..',
    '.k44wP44333332k.',
    'k44PP4333333322k',
    'k44P43333333322k',
    'k44333333333322k',
    'k43333333333222k',
    '.k333333333222k.',
    '..k3333333222k..',
    '...k33333221k...',
    '....k333221k....',
    '.....k3221k.....',
    '......k21k......',
    '.......kk.......',
    '................',
  ];
  const heart = [px(heartA), px(heartB)];

  // ================================================================ SPARKLE
  // Top-left quadrants, mirrored both ways around a solid 2x2 white core, then rimmed in orange
  // so the twinkle still reads over white clouds: small + -> big + -> eight-point star -> tiny +.
  const sparkle = [
    [
      '........',
      '........',
      '........',
      '........',
      '........',
      '.......l',
      '.......w',
      '.....lww',
    ], [
      '........',
      '.......y',
      '.......l',
      '.......l',
      '.......w',
      '......lw',
      '.....lww',
      '.yllwwww',
    ], [
      '........',
      '........',
      '..yl....',
      '..lll..y',
      '...lwl.l',
      '....lwlw',
      '.....lww',
      '...ylwww',
    ], [
      '........',
      '........',
      '........',
      '........',
      '........',
      '........',
      '.......l',
      '......lw',
    ],
  ].map(q => {
    const b = B(16, 16);
    const full = q.map(r => r + r.split('').reverse().join(''));
    stamp(b, full.concat(full.slice().reverse()), 0, 0);
    outline(b, OR[2]);
    return out(b);
  });

  // ================================================================== PUFFS
  // Cloud lobes painted back to front as separate balls, each lit from the upper-left with a
  // shadow crescent on its lower-right, so every lobe keeps its own volume inside the mass.
  // lobes: [x0, y0, diameter]; cols: [shadow, base, light].
  function puffs(b, lobes, cols, edge) {
    lobes.forEach(l => {
      const r = l[2] / 2;
      disc(b, l[0], l[1], l[2], cols[1]);
      disc(b, l[0], l[1], l[2], cols[0], (x, y) => (x + .5 - l[0] - r) * 0.7 + (y + .5 - l[1] - r) > r * 0.5);
      disc(b, l[0], l[1], l[2], cols[2], (x, y) => l[2] > 3 && Math.hypot(x + .5 - l[0] - r * 0.7, y + .5 - l[1] - r * 0.7) < r * 0.55);
    });
    if (edge) outline(b, edge);
  }
  // The engine draws the dust frame with its vertical centre on the feet line, so the puff
  // is born on rows 5-9 (ground line = row 8), swells, then lifts off as shrinking round puffs.
  const DUSTC = [BR[3], BR[4], BR[5]];
  const dust = [
    [[5, 5, 5], [8, 6, 4]],
    [[2, 3, 6], [6, 3, 7], [10, 5, 5]],
    [[1, 2, 5], [5, 1, 6], [10, 3, 5]],
    [[2, 2, 4], [8, 1, 4], [12, 4, 2]],
  ].map(l => { const b = B(16, 16); puffs(b, l, DUSTC, BR[2]); return out(b); });

  // =================================================================== POOF
  // White impact burst -> one lumpy smoke mass -> ring of puffs opening up -> small fading puffs.
  const POOFC = [ST[3], ST[4], WHT];
  function ring(n, R, sizes, a0) {
    const l = [];
    for (let i = 0; i < n; i++) {
      const a = a0 + (i * 2 * Math.PI) / n, d = sizes[i % sizes.length];
      l.push([Math.round(12 + Math.cos(a) * R - d / 2), Math.round(12 + Math.sin(a) * R - d / 2), d]);
    }
    return l;
  }
  const poof = [0, 1, 2, 3, 4].map(f => {
    const b = B(24, 24);
    if (f === 0) {                               // chunky eight-point impact burst, white with a slate rim
      const V = [];
      for (let i = 0; i < 16; i++) { const R = i % 2 ? 5.6 : i % 4 ? 8 : 10.6; V.push([Math.cos(i * Math.PI / 8) * R, Math.sin(i * Math.PI / 8) * R]); }
      for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) {
        const dx = x + .5 - 12, dy = y + .5 - 12, r = Math.hypot(dx, dy);
        const i = Math.floor(((Math.atan2(dy, dx) + 2 * Math.PI) % (2 * Math.PI)) / (Math.PI / 8)) % 16, p = V[i], q = V[(i + 1) % 16];
        if ((q[0] - p[0]) * (dy - p[1]) - (q[1] - p[1]) * (dx - p[0]) >= 0) S(b, x, y, r < 5.2 || dx + dy < 0 ? WHT : ST[4]);
      }
      outline(b, ST[1]);
    }
    if (f === 1) puffs(b, [[12, 10, 10], [11, 2, 10], [2, 10, 10], [7, 13, 9], [3, 3, 10], [7, 6, 10]], POOFC, ST[1]);
    if (f === 2) puffs(b, ring(6, 7.5, [7, 6], 0.6), POOFC, ST[1]);
    if (f === 3) puffs(b, ring(6, 9, [5, 4], 0.7), POOFC, ST[1]);
    if (f === 4) puffs(b, ring(3, 9.5, [4], 0.8).concat(ring(3, 9.5, [2], 0.8 + Math.PI / 3)), POOFC, ST[1]);
    return out(b);
  });

  // ================================================================= SPLASH
  // A solid tapered column with two thick side fingers on a foam mound, plus four chunky
  // droplets that arc out and fall. Each frame: [mound half-width, mound height,
  // tubes [x0, y0, d0, x1, y1, d1] (mirrored), droplets [x, y, size] (mirrored)].
  const SPL = [
    [11, 7, [[16, 20, 7, 16, 16, 4], [10, 21, 5, 8, 18, 3]], []],
    [11, 7, [[16, 20, 9, 16, 8, 3], [11, 20, 6, 7, 13, 3]], [[3, 9, 3]]],
    [12, 6, [[16, 20, 9, 16, 4, 3], [11, 20, 6, 6, 10, 3]], [[1, 5, 3], [8, 1, 3]]],
    [12, 6, [[16, 21, 8, 16, 11, 3], [10, 21, 5, 6, 15, 3]], [[1, 10, 3], [6, 5, 3]]],
    [13, 5, [[16, 22, 6, 16, 19, 4]], [[1, 17, 2], [6, 14, 2]]],
  ];
  const splash = SPL.map(fr => {
    const b = B(32, 24), k = B(32, 24);
    const a = fr[0], h = fr[1];
    for (let y = 24 - h; y < 24; y++) {
      const hw = Math.round(a * Math.sqrt(1 - Math.pow((23.5 - y - 0.5) / h, 2)));
      for (let x = 16 - hw; x < 16 + hw; x++) S(k, x, y, 1);
    }
    fr[2].forEach(t => {
      const n = Math.max(Math.abs(t[3] - t[0]), Math.abs(t[4] - t[1])) * 2 || 1;
      for (let i = 0; i <= n; i++) {
        const u = i / n, d = Math.round(t[2] + (t[5] - t[2]) * u), cx = t[0] + (t[3] - t[0]) * u, cy = t[1] + (t[4] - t[1]) * u;
        const x0 = Math.round(cx - d / 2), y0 = Math.round(cy - d / 2);
        disc(k, x0, y0, d, 1); disc(k, 32 - x0 - d, y0, d, 1);
      }
    });
    fr[3].forEach(d => { for (let j = 0; j < d[2]; j++) for (let i = 0; i < d[2]; i++) { S(k, d[0] + i, d[1] + j, 1); S(k, 31 - d[0] - i, d[1] + j, 1); } });
    const m = (x, y) => Gt(k, x, y) === 1;
    for (let y = 0; y < 24; y++) for (let x = 0; x < 32; x++) {
      if (!m(x, y)) continue;
      let x0 = x, x1 = x;
      while (m(x0 - 1, y)) x0--;
      while (m(x1 + 1, y)) x1++;
      const w = x1 - x0 + 1, i = x - x0;
      // lit left third, pale blue middle, darker right third (1px each on thin fingers / droplets)
      const lit = Math.max(1, Math.round(w * 0.38)), drk = Math.max(1, Math.round(w * 0.3));
      S(b, x, y, w === 2 ? (i ? BL[3] : WHT) : i < lit ? WHT : i >= w - drk ? (i === w - 1 && w > 5 ? BL[2] : BL[3]) : BL[4]);
    }
    outline(b, BL[1]);
    return out(b);
  });

  // =============================================================== BIG COIN
  // Star medallion: gold rim, emerald enamel field, raised pale-gold star.
  // The face squeezes into an ellipse while the rim wall swings past: lit wall on
  // the left while the face turns away, dark wall on the right as it turns back.
  const GOLD = [GO[0], GO[1], GO[2], GO[3], WHT];
  const TEALS = ['#073636', TE[0], '#126862', TE[1], '#28a690', TE[2], TE[3]];
  // Half-profiles (row widths, top -> middle) of the 20px tall coin and its 16px tall enamel field
  // at full width; narrower views scale them to an even width, so every silhouette is a clean,
  // symmetric ellipse centred in the frame.
  const ELL20 = [8, 12, 14, 16, 18, 18, 20, 20, 20, 20], FLD16 = [6, 10, 12, 14, 14, 16, 16, 16];
  const even = v => Math.max(2, Math.round(v / 2) * 2);
  const STAR = [
    '.....##.....',
    '.....##.....',
    '....####....',
    '....####....',
    '############',
    '############',
    '.##########.',
    '..########..',
    '..########..',
    '.####..####.',
    '.###....###.',
    '.##......##.',
  ];
  const STAR4 = ['.##.', '.##.', '.##.', '.##.', '####', '####', '####', '.##.', '####', '####', '#..#', '#..#'];
  // W = silhouette width, e = visible rim-wall thickness (on the trailing side), side = -1 wall on
  // the left (lit), +1 wall on the right (in shade).
  function coinFrame(W, e, side) {
    const b = B(24, 24);
    if (W <= 4) {                               // edge-on: thick rim wall with a centre groove
      const cols = [GOLD[3], GOLD[2], GOLD[0], GOLD[1]];
      for (let y = 2; y < 22; y++) for (let j = 0; j < 4; j++) {
        if ((y === 2 || y === 21) && (j === 0 || j === 3)) continue;

      }

      return out(b);
    }
    const fw = W - e, x0 = 12 - W / 2, fx = side < 0 ? x0 + e : x0;    // face ellipse left edge
    const sil = (x, y) => { const i = y - 2; if (i < 0 || i > 19) return false; const w = even(ELL20[i < 10 ? i : 19 - i] * W / 20), s0 = 12 - w / 2; return x >= s0 && x < s0 + w; };
    const inFace = (x, y) => { const i = y - 2; if (!sil(x, y)) return false; const w = even(ELL20[i < 10 ? i : 19 - i] * fw / 20), s0 = fx + (fw - w) / 2; return x >= s0 && x < s0 + w; };

  }
  const bigCoin = [
    coinFrame(20, 0, 0), coinFrame(16, 2, -1), coinFrame(12, 4, -1),

  // =================================================================== FONT
  const GLYPHS = {

    '1': '.##. ###. .##. .##. .##. ####',
    '2': '.####. ##..## ...##. ..##.. .##... ######',
    '3': '.####. ##..## ...##. ....## ##..## .####.',
    '4': '..###. .####. ##.##. ###### ...##. ...##.',
    '5': '###### ##.... #####. ....## ##..## .####.',
    '6': '.####. ##.... #####. ##..## ##..## .####.',
    '7': '###### ....## ...##. ..##.. ..##.. ..##..',
    '8': '.####. ##..## .####. ##..## ##..## .####.',
    '9': '.####. ##..## ##..## .##### ....## .####.',
    A: '.####. ##..## ##..## ###### ##..## ##..##',
    B: '#####. ##..## #####. ##..## ##..## #####.',
    C: '.####. ##..## ##.... ##.... ##..## .####.',
    D: '####.. ##.##. ##..## ##..## ##.##. ####..',
    E: '###### ##.... #####. ##.... ##.... ######',
    F: '###### ##.... #####. ##.... ##.... ##....',
    G: '.####. ##.... ##.### ##..## ##..## .####.',
    H: '##..## ##..## ###### ##..## ##..## ##..##',

    P: '#####. ##..## ##..## #####. ##.... ##....',
    Q: '.####. ##..## ##..## ##.### .####. ....##',
    R: '#####. ##..## ##..## #####. ##.##. ##..##',
    S: '.####. ##..## .###.. ..###. ##..## .####.',
    T: '###### ..##.. ..##.. ..##.. ..##.. ..##..',
    U: '##..## ##..## ##..## ##..## ##..## .####.',
    V: '##..## ##..## ##..## .####. .####. ..##..',
    W: '##...## ##...## ##.#.## ####### ###.### ##...##',
    X: '##..## .####. ..##.. ..##.. .####. ##..##',
    Y: '##..## ##..## .####. ..##.. ..##.. ..##..',
    Z: '###### ....## ..###. .###.. ##.... ######',
    '!': '## ## ## ## .. ##',
    '?': '.####. ##..## ...##. ..##.. ...... ..##..',
    ':': '.. ## ## .. ## ##',
    '.': '.. .. .. .. ## ##',
    ',': '... ... ... .## .## ##.',
    '-': '.... .... #### #### .... ....',
    "'": '## ## #. .. .. ..',
    x: '.... .... #..# .##. .##. #..#',
    '+': '..##.. ..##.. ###### ###### ..##.. ..##..',

  const FACE = [WHT, WHT, GO[3], GO[3], GO[2], GO[2]];
  const font = {};
  Object.keys(GLYPHS).forEach(ch => {

  // ==================================================================== HUD
  // Medal slots: coinOn = the star medallion in miniature, coinOff = the empty socket it

  const coinOn = spr([
    '................',
    '.....llllyy.....',
    '....lyyyyyyG....',
    '...lyyttttyGG...',
    '..lyttTwwTTTGD..',
    '..lytTTwwTTTGD..',
    '.lytwwwwwwwwTGD.',
    '.lytTwwwwwlTTGD.',
    '.yytTTwwwlTTMGD.',
    '.yGtTwwTTwlTMGD.',
    '..yGTwTTTTlMGD..',
    '..GGTTTTTMMMGD..',
    '...GGGMMMMGDD...',
    '....GGGGGDDD....',
    '.....GDDDDD.....',
    '................',

    '................',
    '.....SSSSSS.....',
    '....SkkkkkkS....',
    '...SkkssssssS...',
    '..SksssSSssssS..',
    '..SksssSSsssuS..',
    '.SksSSSSSSSSsuS.',
    '.SkssSSSSSSssuS.',
    '.SksssSSSSsssuS.',
    '.SkssSSssSSssuS.',
    '..SssSssssSsuS..',
    '..SsssssssssuS..',
    '...SssssssuuS...',
    '....SuuuuuuS....',
    '.....SSSSSS.....',

  // =================================================================== LOGO

  // dip in the middle of the word and Kit's tail sweeps underneath as a swash.
  const logo = (function () {
    const LW = 250, LH = 80;                        // the word (not the tail plume) is centred on the canvas
    const MK = (w, h, f) => {
      const m = { w, h, d: new Uint8Array(w * h) };

    const GLY = {
      S: (W, H) => { const m0 = (H >> 1) - 4, m1 = m0 + 8; return not([rrect(T, 9, W + 20, m0, 4), rrect(-20, m1, W - T, H - 9, 4), cut(0, 0, 12, 1, 1), cut(0, m1, 12, 1, -1), cut(W, m0, 12, -1, 1), cut(W, H, 12, -1, -1)]); },
      U: (W, H) => not([rrect(T, -20, W - T, H - 9, (W - 2 * T) / 2), cut(0, H, 13, 1, -1), cut(W, H, 13, -1, -1)]),

    const depth = (x, y) => { for (let k = 1; k <= 4; k++) if (on(OUT, x - k, y - k)) return k; return 0; };
    const EXT = MK(LW, LH, (x, y) => !on(OUT, x, y) && depth(x, y) > 0);

    // ---- sun: disc crowned with triangular rays, only the cap above the N / F dip is kept
    const SX = LW / 2, SY = 39, SR = 27, SCLIP = 27;
    const inDisc = (x, y) => (x + .5 - SX) * (x + .5 - SX) + (y + .5 - SY) * (y + .5 - SY) <= SR * SR;
    const RAYS = [[90, 11], [75, 8], [105, 8], [60, 11], [120, 11], [45, 9], [135, 9]];   // [angle, length]

    const rayHalf = (x, y) => {
      const px = x + .5 - SX, py = y + .5 - SY;

    // ---- tail: a tapering tube around a Catmull-Rom centre line [x, y, radius]. It slips out from
    // under the X, runs below the word and curls up into a bushy cream-tipped plume left of the S.
    const TP = [[224, 52, 2.5], [215, 60, 2.5], [206, 68.5, 3], [184, 72.5, 3.2], [146, 73.8, 3.6], [93, 74, 4], [46, 73.5, 4.8],
      [25, 69.5, 6.5], [14.5, 58, 9], [11.5, 45, 9.5], [12, 33, 8], [15, 24.5, 4.5], [18.5, 19.5, 1.5], [20, 18, 0.5]];
    const TS = [], ARC = [0];
    for (let i = 1; i < TP.length - 2; i++) for (let k = 0; k < 16; k++) {
      const t = k / 16, p0 = TP[i - 1], p1 = TP[i], p2 = TP[i + 1], p3 = TP[i + 2];

        const dx = px - a[0] - ex * u, dy = py - a[1] - ey * u, d = dx * dx + dy * dy;

      }
      const q0 = (tx * oy - ty * ox) / Math.hypot(tx, ty);
      // fur: saw-tooth tufts along the outer edge of the brush, each one sweeping back toward the tip
      const fur = q0 < 0 && br > 5.2 ? Math.min(3.2, br * 0.36) * (1 - (ba / 9 - Math.floor(ba / 9))) : 0;
      if (Math.sqrt(bd) > br - fur) return false;
      // lit from above under the word (the underside falls into shade), swinging round to the left on the plume
      const tt = Math.max(0, Math.min(1, (ba - 185) / 30));
      TL[y * LW + x] = -((0.447 + 0.4 * tt) * ox + (0.894 - 0.37 * tt) * oy) / br; TA[y * LW + x] = ba; TQ[y * LW + x] = (tx * oy - ty * ox) / Math.hypot(tx, ty);

    });

    // ---- paint, back to front
    const b = B(LW, LH);
    const inkAround = m => { const g = dil(m, CROSS); each((x, y) => { if (on(g, x, y)) S(b, x, y, INK); }); };
    // 1px bevel classes of a mask: 1 lit edge, 2 shaded edge, 0 elsewhere
    const edge = (m, x, y) => (!on(m, x - 1, y) || !on(m, x, y - 1)) ? ((!on(m, x + 1, y) || !on(m, x, y + 1)) ? 0 : 1) : ((!on(m, x + 1, y) || !on(m, x, y + 1)) ? 2 : 0);
    inkAround(SUN);
    each((x, y) => {
      if (!on(SUN, x, y)) return;
      const e = edge(SUN, x, y);
      if (inDisc(x, y)) {                           // orange rim band, gold body, pale glow crescent on the lit shoulder
        const d = Math.hypot(x + .5 - SX, y + .5 - SY), dx = x + .5 - SX;
        S(b, x, y, d > SR - 1.2 ? (dx < 4 ? GO[3] : OR[3]) : d > SR - 4 ? (dx < 6 ? OR[3] : OR[2]) : d > SR - 8.5 && d <= SR - 5.5 && dx < -3 ? WHT : d > SR - 10 && dx < 2 ? GO[3] : GO[2]);
      } else S(b, x, y, rayHalf(x, y) === 1 ? (e === 1 ? GO[3] : GO[2]) : (e === 2 ? OR[1] : OR[2]));
    });
    inkAround(TAIL);
    each((x, y) => {
      if (!on(TAIL, x, y)) return;
      const l = TL[y * LW + x];
      const z = TQ[y * LW + x] / 5 + 0.25, zig = Math.abs(z - Math.floor(z) - 0.5) * 2;     // 5px wide teeth across the tail
      if (TA[y * LW + x] > 217 + 4 * zig) S(b, x, y, l > 0 ? WHT : l < -0.3 ? BR[4] : BR[5]);
      else S(b, x, y, l > 0.72 ? OR[4] : l > 0.25 ? OR[3] : l < -0.72 ? OR[0] : l < -0.25 ? OR[1] : OR[2]);
    });
    inkAround(EXT);
    const NEAR = dil(OUT, SE(5));                   // the side walls are lighter along the 2px next to the outline
    each((x, y) => {
      if (on(EXT, x, y)) S(b, x, y, on(NEAR, x, y) ? BL[1] : BL[0]);
      else if (on(OUT, x, y)) S(b, x, y, INK);
    });
    // faces: banded gradient + bevel (ring 1 / ring 2 lit or shaded by the outward normal)
    const E1 = ero(FACE, CROSS), E2 = ero(E1, CROSS);
    const RAMP = [WHT, GO[3], GO[2], OR[3], OR[2], OR[1], OR[0]];
    each((x, y) => {
      if (!on(FACE, x, y)) return;
      // face: gold top, amber middle, orange foot, the two changes softened by a 2-row checker

// ---- src/audio.js ----

//   init()            create/resume the AudioContext (call on the first user gesture; idempotent)

  A._render = function (name, seconds, sfxList, raw) {

    const oc = new OC(2, Math.floor(sr * seconds), sr), R2 = makeRack(oc, { offline: true, raw: !!raw });
