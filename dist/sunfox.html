<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0916">
<title>SUNFOX — Emerald Coast</title>
<style>
  /* One-screen game: a fixed #app box holds the stage and the touch controls.
     On phones held upright the whole box is rotated 90° so the game is always played in landscape. */
  :root {
    color-scheme: dark;
    --bg: #0d0916; --ink: #1a1226; --cream: #fff8e8; --gold: #ffd630;
    --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--cream); overflow: hidden; overscroll-behavior: none;
               touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; left: 0; top: 0; width: 100%; height: 100%; box-sizing: border-box; transform-origin: 0 0; overflow: hidden;
         --pl: max(16px, var(--sal)); --pr: max(16px, var(--sar)); --pt: max(6px, var(--sat)); --pb: max(6px, var(--sab));
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
         padding-block: max(6px, env(safe-area-inset-top, 0px)) max(6px, env(safe-area-inset-bottom, 0px)); }
  /* rotated 90° clockwise: the player's left is the screen's top edge, their right is its bottom edge */
  #app.rot { --pl: max(16px, var(--sat)); --pr: max(16px, var(--sab)); --pt: max(6px, var(--sar)); --pb: max(6px, var(--sal));
             padding-left: var(--pl); padding-right: var(--pr); padding-block: var(--pt) var(--pb); }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #5cc8f8;
            box-shadow: 0 0 0 2px var(--ink), 0 8px 40px rgba(0,0,0,.6); }
  #screen.soft { image-rendering: auto; }

  .pad { position: absolute; bottom: calc(var(--pb) + 10px); display: none; gap: 14px; align-items: flex-end; z-index: 5; }
  #padL { left: var(--pl); }
  #padR { right: var(--pr); }
  .btn { width: 72px; height: 72px; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
         background: rgba(26,18,38,.38); border: 2px solid rgba(255,248,232,.55); color: rgba(255,248,232,.9);
         font: 700 15px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .08em; }
  .btn svg { width: 30px; height: 30px; fill: currentColor; }
  .btn.on { background: rgba(255,214,48,.5); border-color: var(--gold); color: var(--ink); }
  #bJump { width: 92px; height: 92px; }
  .mini { position: absolute; top: calc(var(--pt) + 4px); width: 40px; height: 40px; font-size: 13px; display: none; z-index: 5; }
  .mini svg { width: 18px; height: 18px; }
  #bPause { right: var(--pr); }
  #bRot { right: calc(var(--pr) + 48px); }
  .touch .pad, .touch .mini { display: flex; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="screen" width="384" height="216"></canvas></div>
  <div class="pad" id="padL">
    <div class="btn" id="bLeft" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M16 4 L6 12 L16 20 Z"/></svg></div>
    <div class="btn" id="bRight" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M8 4 L18 12 L8 20 Z"/></svg></div>
  </div>
  <div class="pad" id="padR"><div class="btn" id="bJump" aria-label="Jump">JUMP</div></div>
  <div class="btn mini" id="bRot" aria-label="Rotate the game"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></div>
  <div class="btn mini" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></div>
</div>
<script>
// ---- src/lib.js ----
// SUNFOX — core namespace + pixel-art helpers shared by every art module.
(function () {
  const G = (window.G = window.G || {});
  G.W = 384; // native screen width  (16:9, x5 = 1920x1080)
  G.H = 216; // native screen height
  G.T = 16; // tile size

  // Shared master palette. Ramps go dark -> light and are hue-shifted
  // (shadows drift toward purple/blue, highlights toward yellow).
  G.PAL = {
    ink: '#1a1226', // universal dark outline (never pure black)
    white: '#fff8e8',
    green: ['#0f3b2e', '#1a6b3a', '#2fa043', '#6cd13c', '#c4f25c'],
    teal: ['#0c4a4a', '#17857a', '#3cc8a8', '#a0f0d0'],
    brown: ['#2b1622', '#5a2a2a', '#8f4a2e', '#c47a3c', '#eab368', '#ffe0a0'],
    stone: ['#2a2640', '#4a4a6a', '#7a7f9c', '#b0b8cc', '#e6ecf4'],
    orange: ['#7a2414', '#c2421a', '#f07a1c', '#ffb23c', '#ffe27a'],
    red: ['#5e0f2a', '#a81c30', '#e03434', '#ff7a5a'],
    blue: ['#14204e', '#1f47a0', '#2f86e0', '#5cc8f8', '#b8f0ff'],
    purple: ['#2e1250', '#5a2a8c', '#9450c8', '#d090f0'],
    gold: ['#8a5a10', '#d49a18', '#ffd630', '#fff6a8'],
    pink: ['#b04860', '#f08a90', '#ffc8c0'],
  };

  // New canvas. `c.ctx` is its 2D context.
  G.cv = function (w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    c.ctx = c.getContext('2d');
    c.ctx.imageSmoothingEnabled = false;
    return c;
  };

  // Build a sprite from rows of characters. `pal` maps char -> '#rrggbb'.
  // '.' and ' ' are always transparent. All rows must have equal length.
  G.px = function (rows, pal) {
    const h = rows.length;
    const w = rows[0].length;
    const c = G.cv(w, h);
    for (let y = 0; y < h; y++) {
      const r = rows[y];
      if (r.length !== w) throw new Error('G.px: row ' + y + ' has length ' + r.length + ', expected ' + w + ' :: "' + r + '"');
      for (let x = 0; x < w; x++) {
        const ch = r[x];
        if (ch === '.' || ch === ' ') continue;
        const col = pal[ch];
        if (!col) throw new Error('G.px: unknown palette char "' + ch + '" at ' + x + ',' + y);
        c.ctx.fillStyle = col;
        c.ctx.fillRect(x, y, 1, 1);
      }
    }
    return c;
  };

  G.flipH = function (src) {
    const c = G.cv(src.width, src.height);
    c.ctx.translate(src.width, 0);
    c.ctx.scale(-1, 1);
    c.ctx.drawImage(src, 0, 0);
    return c;
  };

  // Copy a canvas (optionally onto a bigger canvas at an offset).
  G.copy = function (src, w, h, ox, oy) {
    const c = G.cv(w || src.width, h || src.height);
    c.ctx.drawImage(src, ox || 0, oy || 0);
    return c;
  };

  // Art registry. Each art module calls G.defineArt('name', G => ({...canvases})).
  G.art = G.art || {};
  G.defineArt = function (name, fn) {
    G.art[name] = fn(G);
  };

  // ---- Parallax backdrop (shared by the engine and the art preview tool) ----
  // B = G.art.bg. camUp = how far the camera is raised above the level's bottom (px).
  // A layer may set `raster: k` (> 1): it is then drawn in 2px strips whose scroll speed grows
  // from `speed` at its top row to `speed * k` at its bottom row — the classic line-scroll
  // trick that gives a sea or a plain fake perspective.
  G.drawBackground = function (ctx, B, camX, camUp, t) {
    if (!B) { ctx.fillStyle = '#5cc8f8'; ctx.fillRect(0, 0, G.W, G.H); return; }
    ctx.drawImage(B.sky, 0, 0);
    for (const L of B.layers) {
      const im = L.img, w = im.width;
      const y = Math.round(L.y + camUp * L.speed * 0.5);
      const drift = (L.auto || 0) * t;
      if (L.raster) {
        for (let sy = Math.max(0, -y) & ~1; sy < im.height && y + sy < G.H; sy += 2) {
          const sp = L.speed * (1 + (L.raster - 1) * (sy / im.height));
          let x = -((camX * sp + drift) % w);
          if (x > 0) x -= w;
          for (x = Math.floor(x); x < G.W; x += w) ctx.drawImage(im, 0, sy, w, 2, x, y + sy, w, 2);
        }
        continue;
      }
      let x = -((camX * L.speed + drift) % w);
      if (x > 0) x -= w;
      for (x = Math.floor(x); x < G.W; x += w) ctx.drawImage(im, x, y);
    }
  };

  // ---- Tile collision shapes (shared by engine + terrain renderer) ----
  // '#' full solid. Slopes: '/' 45deg rising to the right, '\\' 45deg falling
  // to the right, '1','2' gentle rise (two tiles), '3','4' gentle fall.
  // Returns solid height (0..16) measured from the tile's bottom at local column lx.
  G.tileH = function (ch, lx) {
    switch (ch) {
      case '#': return 16;
      case '/': return lx + 1;
      case '\\': return 16 - lx;
      case '1': return (lx >> 1) + 1;
      case '2': return (lx >> 1) + 9;
      case '3': return 16 - (lx >> 1);
      case '4': return 8 - (lx >> 1);
      default: return 0;
    }
  };
})();

</script>
<script>
// ---- src/terrain_render.js ----
// Pre-renders the level's solid terrain (dirt body, depth shading, walls,
// undersides, grass cap following slopes) into chunk canvases.
(function () {
  const G = window.G;
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const CHUNK = 512;

  function texData(cnv, fallback) {
    if (!cnv) {
      cnv = G.cv(64, 64);
      cnv.ctx.fillStyle = fallback;
      cnv.ctx.fillRect(0, 0, 64, 64);
    }
    const d = cnv.getContext('2d').getImageData(0, 0, cnv.width, cnv.height);
    return { w: cnv.width, h: cnv.height, d: new Uint32Array(d.data.buffer) };
  }

  // grid: array of equal-length strings. T: G.art.terrain (pieces may be missing).
  G.buildTerrain = function (grid, T) {
    T = T || {};
    const rows = grid.length, cols = grid[0].length;
    const W = cols * 16, H = rows * 16;
    const mask = new Uint8Array(W * H);
    for (let cy = 0; cy < rows; cy++) {
      for (let cx = 0; cx < cols; cx++) {
        const ch = grid[cy][cx];
        if (ch === ' ') continue;
        for (let lx = 0; lx < 16; lx++) {
          const h = G.tileH(ch, lx);
          for (let k = 0; k < h; k++) mask[(cy * 16 + 15 - k) * W + cx * 16 + lx] = 1;
        }
      }
    }
    const solid = (x, y) => (y < 0 ? 0 : x < 0 || x >= W || y >= H ? 1 : mask[y * W + x]);

    // Chamfer distance to nearest air pixel (3 per orthogonal step, 4 per diagonal).
    const dist = new Uint16Array(W * H);
    const INF = 60000;
    for (let i = 0; i < W * H; i++) dist[i] = mask[i] ? INF : 0;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (!dist[i]) continue;
        let d = dist[i];
        if (y === 0) d = Math.min(d, 3);
        else {
          d = Math.min(d, dist[i - W] + 3);
          if (x > 0) d = Math.min(d, dist[i - W - 1] + 4);
          if (x < W - 1) d = Math.min(d, dist[i - W + 1] + 4);
        }
        if (x > 0) d = Math.min(d, dist[i - 1] + 3);
        dist[i] = d;
      }
    }
    for (let y = H - 1; y >= 0; y--) {
      for (let x = W - 1; x >= 0; x--) {
        const i = y * W + x;
        if (!dist[i]) continue;
        let d = dist[i];
        if (y < H - 1) {
          d = Math.min(d, dist[i + W] + 3);
          if (x > 0) d = Math.min(d, dist[i + W - 1] + 4);
          if (x < W - 1) d = Math.min(d, dist[i + W + 1] + 4);
        }
        if (x < W - 1) d = Math.min(d, dist[i + 1] + 3);
        dist[i] = d;
      }
    }

    const dirt = texData(T.dirt, '#8f4a2e');
    const deep = texData(T.dirtDeep, '#5a2a2a');
    const NEAR = 50 * 3, FAR = 74 * 3; // pixels of depth where the dithered blend to dirtDeep happens

    const chunks = [];
    for (let x0 = 0; x0 < W; x0 += CHUNK) {
      const cw = Math.min(CHUNK, W - x0);
      const c = G.cv(cw, H);
      const img = c.ctx.createImageData(cw, H);
      const out = new Uint32Array(img.data.buffer);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < cw; x++) {
          const wx = x0 + x;
          const i = y * W + wx;
          if (!mask[i]) continue;
          const d = dist[i];
          let useDeep = false;
          if (d >= FAR) useDeep = true;
          else if (d > NEAR) useDeep = ((d - NEAR) / (FAR - NEAR)) * 16 > BAYER[(y & 3) * 4 + (wx & 3)] + 0.5;
          const t = useDeep ? deep : dirt;
          out[y * cw + x] = t.d[(y % t.h) * t.w + (wx % t.w)];
        }
      }
      c.ctx.putImageData(img, 0, 0);
      chunks.push(c);
    }
    // Draw helper that splats onto whichever chunk(s) a world rect touches.
    function blit(src, sx, sy, sw, sh, dx, dy) {
      const a = Math.floor(dx / CHUNK), b = Math.floor((dx + sw - 1) / CHUNK);
      for (let k = a; k <= b; k++) if (chunks[k]) chunks[k].ctx.drawImage(src, sx, sy, sw, sh, dx - k * CHUNK, dy, sw, sh);
    }
    const tileAt = (cx, cy) => (cy < 0 ? ' ' : cx < 0 || cx >= cols || cy >= rows ? '#' : grid[cy][cx]);

    // Exposed vertical faces + undersides (tile level).
    for (let cy = 0; cy < rows; cy++) {
      for (let cx = 0; cx < cols; cx++) {
        const ch = grid[cy][cx];
        if (ch === ' ' || ch === '=') continue;
        const X = cx * 16, Y = cy * 16;
        if (ch === '#') {
          for (let k = 0; k < 16; k++) {
            const y = Y + k;
            if (T.wallL && !solid(X - 1, y)) blit(T.wallL, 0, y % T.wallL.height, 8, 1, X, y);
            if (T.wallR && !solid(X + 16, y)) blit(T.wallR, 0, y % T.wallR.height, 8, 1, X + 8, y);
          }
        }
        const below = tileAt(cx, cy + 1);
        if (T.under && (below === ' ' || below === '=')) blit(T.under, X % T.under.width, 0, 16, 8, X, Y + 8);
      }
    }
    // Grass cap: one 1px column per surface pixel, so it follows any slope.
    const gr = T.grass;
    const tops = []; // [x, y] of every surface
    for (let x = 0; x < W; x++) {
      for (let y = 1; y < H; y++) {
        if (mask[y * W + x] && !mask[(y - 1) * W + x]) {
          tops.push(x, y);
          if (!gr) continue;
          let len = 0; // clip the mat to the solid body
          while (len < gr.height - 8 && y + len < H && mask[(y + len) * W + x]) len++;
          blit(gr, x % gr.width, 0, 1, 8 + len, x, y - 8);
        }
      }
    }
    for (let i = 0; i < tops.length; i += 2) {
      const x = tops[i], y = tops[i + 1];
      const openL = !solid(x - 1, y) && !solid(x - 1, y + 7) && !solid(x - 1, y + 3);
      const openR = !solid(x + 1, y) && !solid(x + 1, y + 7) && !solid(x + 1, y + 3);
      if (openL && T.grassEndL) blit(T.grassEndL, 0, 0, 8, T.grassEndL.height, x - 4, y - 8);
      if (openR && T.grassEndR) blit(T.grassEndR, 0, 0, 8, T.grassEndR.height, x - 3, y - 8);
    }

    return {
      W, H, chunks,
      draw(ctx, camX, camY) {
        const a = Math.max(0, Math.floor(camX / CHUNK)), b = Math.min(chunks.length - 1, Math.floor((camX + G.W) / CHUNK));
        for (let k = a; k <= b; k++) ctx.drawImage(chunks[k], k * CHUNK - camX, -camY);
      },
    };
  };
})();

</script>
<script>
// ---- src/art/terrain.js ----
// SUNFOX — terrain art: ground textures (composited by src/terrain_render.js),
// platforms, prize block, spring, spikes, checkpoint, goal gate, sign.
G.defineArt('terrain', G => {
  const P = G.PAL;
  const BR = P.brown, GR = P.green, ST = P.stone;

  // Shared character palette for G.px sprites.
  const C = {
    k: P.ink, w: P.white,
    0: BR[0], 1: BR[1], 2: BR[2], 3: BR[3], 4: BR[4], 5: BR[5],
    a: GR[0], b: GR[1], c: GR[2], d: GR[3], e: GR[4],
    s: ST[0], t: ST[1], u: ST[2], v: ST[3], x: ST[4],
    o: P.orange[0], p: P.orange[1], q: P.orange[2], r: P.orange[3], y: P.orange[4],
    G: P.gold[0], H: P.gold[1], I: P.gold[2], J: P.gold[3],
    R: P.red[0], S: P.red[1], T: P.red[2], U: P.red[3],
    m: P.teal[0], n: P.teal[1], M: P.teal[2], N: P.teal[3],
  };
  const px = (rows, pal) => G.px(rows, pal || C);
  const mod = (a, n) => ((a % n) + n) % n;

  // Wrapping pixel for seamless textures.
  function dot(c, x, y, col) {
    c.ctx.fillStyle = col;
    c.ctx.fillRect(mod(x, c.width), mod(y, c.height), 1, 1);
  }
  // Stamp rows of chars with a local palette ('.' = skip), wrapping.
  function stamp(c, rows, x, y, pal) {
    for (let j = 0; j < rows.length; j++)
      for (let i = 0; i < rows[j].length; i++) {
        const ch = rows[j][i];
        if (ch !== '.' && ch !== ' ') dot(c, x + i, y + j, pal[ch]);
      }
  }
  function R(c, x, y, w, h, col) { c.ctx.fillStyle = col; c.ctx.fillRect(x, y, w, h); }

  // ------------------------------------------------------------------
  // EARTH — zigzag strata of chunky sun-baked rock slabs (64x64 seamless)
  // Four 16px courses per tile; every course is a light slab over a dark
  // seam, the whole stack folded into a stepped chevron (period 32px).
  // ------------------------------------------------------------------
  const ZOFF = [0, 2, 4, 6, 6, 4, 2, 0];          // chevron lift per 4px column group
  const SLAB = [10, 9, 11, 10];                   // slab thickness in each 16px course
  const JOINT = [[9, 38], [24, 52], [3, 29, 46], [17, 60]]; // vertical cracks per course
  const TONE = [[0, 1], [1, 0], [0, 2, 1], [1, 0]];           // slab tone left→right between cracks
  function band(x, y) {
    x = mod(x, 64);
    const yy = mod(y + ZOFF[(x & 31) >> 2], 64);
    const k = yy >> 4, r = yy & 15, s = SLAB[k];
    if (r >= s) return { slab: 0, k, r: r - s, n: 16 - s };
    const J = JOINT[k];
    let tone = TONE[k][J.length - 1];
    for (let j = 0; j < J.length; j++) {
      const jx = mod(J[j] + (r >= (s >> 1) ? 1 : 0), 64); // cracks step sideways halfway down
      if (x === jx) return { slab: 0, k, r, n: s };
      if (x > jx) tone = TONE[k][j];
    }
    return { slab: 1, k, r, n: s, tone };
  }
  function makeDirt(p, rich) {
    const c = G.cv(64, 64);
    for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) {
      const b = band(x, y), ph = (x & 31) >> 2;
      const up = band(x, y - 1), lf = band(x - 1, y), rt = band(x + 1, y), dn = band(x, y + 1), dn2 = band(x, y + 2);
      const lit = ph >= 1 && ph <= 4;             // rising flank + crest face the sun
      let col;
      if (b.slab) {
        if (!up.slab) col = lit ? p.hi : p.hi2;
        else if (!lf.slab) col = p.hi;
        else if (!dn.slab || !rt.slab) col = p.sh;
        else if (!dn2.slab && !lit) col = p.sh;
        else col = p.slab[b.tone];
      } else {
        col = up.slab || lf.slab || band(x - 1, y - 1).slab ? p.cast : p.seam;
      }
      dot(c, x, y, col);
    }
    if (!rich) return c;
    // embedded sandstone cobbles (hand-placed, wedged into the seams)
    const sp = { h: BR[5], l: BR[4], m: '#d8944c', s: '#a9602f', d: '#73372b', o: BR[1] };
    const cobA = [
      '...lllll...',
      '.llhhhlllm.',
      'lhhhlllllms',
      'lhhllllmmms',
      'llllllmmmsd',
      'lllmmmmmssd',
      '.mmmmssssdo',
      '..sssddddo.',
      '....oooo...',
    ];
    const cobB = [
      '..llll.',
      '.lhhllm',
      'lhhllms',
      'lllmmsd',
      '.mmssdo',
      '..dddo.',
    ];
    const cobC = [
      '.lhl.',
      'lhlms',
      'lmmsd',
      '.sdo.',
    ];
    stamp(c, cobB, 26, 8, sp);
    stamp(c, cobC, 53, 40, sp);
    stamp(c, cobC, 8, 55, sp);
    return c;
  }
  const dirt = makeDirt({ slab: ['#c47a3c', '#b96d38', '#cc8742'], hi: BR[4], hi2: '#d8944c', sh: '#a9602f', seam: BR[2], cast: '#73372b' }, true);
  const dirtDeep = makeDirt({ slab: ['#8f4a2e', '#874530', '#8f4a2e'], hi: '#a9602f', hi2: '#9a5330', sh: '#7e402c', seam: '#73372b', cast: '#62302a' }, false);

  // ------------------------------------------------------------------
  // GRASS CAP — 64x24, row 8 = collision surface
  // Puffy sunlit top, three stacked rows of blade teeth, dark fringe,
  // outline and a cast shadow on the earth below.
  // ------------------------------------------------------------------

    ruinBlock: makeRuinBlock(),
    vine: makeVine(),

});

<script>
// ---- src/art/bg.js ----
// SUNFOX — parallax backdrop for Emerald Coast: sky + 6 layers (far -> near).
// Everything is plotted as indexed pixels (no blending): banded sky with ordered
// dither, puff-sculpted cumulus, faceted islands, line-scroll sea strips with glitter,
// mid headlands with cliffs + waterfalls over a lagoon, near palm/jungle treeline.
G.defineArt('bg', G => {
  const W = G.W, H = G.H;

  // ===================== toolkit =====================
  const HEX = [null], IDX = {};
  const C = hex => IDX[hex] || (HEX.push(hex), (IDX[hex] = HEX.length - 1));
  const CS = list => list.map(C);

  // Indexed pixel layer; x wraps, so anything drawn across an edge tiles seamlessly.
  function layer(w, h) {
    const d = new Uint8Array(w * h);
    const wrap = x => ((x % w) + w) % w;
    return {
      w, h, d,
      get: (x, y) => (y < 0 || y >= h ? 0 : d[y * w + wrap(x)]),
      set: (x, y, c) => { if (y >= 0 && y < h) d[y * w + wrap(x)] = c; },
      row: (x0, x1, y, c) => { if (y >= 0 && y < h) for (let x = x0; x <= x1; x++) d[y * w + wrap(x)] = c; },
      col: (x, y0, y1, c) => { const X = wrap(x); for (let y = Math.max(0, y0); y <= y1 && y < h; y++) d[y * w + X] = c; },
    };
  }
  function bake(L) {
    const c = G.cv(L.w, L.h), im = c.ctx.createImageData(L.w, L.h), o = im.data;
    const rgb = HEX.map(h => (h ? [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)] : null));
    for (let i = 0, j = 0; i < L.d.length; i++, j += 4) {
      const p = rgb[L.d[i]];
      if (!p) continue;
      o[j] = p[0]; o[j + 1] = p[1]; o[j + 2] = p[2]; o[j + 3] = 255;
    }
    c.ctx.putImageData(im, 0, 0);
    return c;
  }
  const rng = seed => {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  // 2x2 ordered-dither thresholds: 25% = sparse dots, 50% = checker, 75% = inverse dots.
  const M2 = [0.125, 0.625, 0.875, 0.375];
  const d2 = (x, y) => M2[(x & 1) | ((y & 1) << 1)];

  // Vertical colour ramp: flat bands joined by 6-row ordered transitions (25/50/75%).
  const TR = [0.25, 0.25, 0.5, 0.5, 0.75, 0.75];
  function vramp(L, y, cols, flats) {
    for (let i = 0; i < cols.length; i++) {
      for (let k = 0; k < flats[i] && y < L.h; k++, y++) L.row(0, L.w - 1, y, cols[i]);
      if (i < cols.length - 1) for (let k = 0; k < 6 && y < L.h; k++, y++) for (let x = 0; x < L.w; x++) L.set(x, y, TR[k] > d2(x, y) ? cols[i + 1] : cols[i]);
    }
    return y;
  }

  // ASCII stamp ('.' = transparent), optionally mirrored.
  function stamp(L, x, y, rows, map, flip) {
    for (let j = 0; j < rows.length; j++) for (let i = 0; i < rows[j].length; i++) {
      const ch = rows[j][flip ? rows[j].length - 1 - i : i];
      if (ch !== '.') L.set(x + i, y + j, map[ch]);
    }
  }
  // Scanline polygon -> rows [y, xa, xb] of pixels whose centres are inside.
  function polyRows(pts) {
    let ya = 1e9, yb = -1e9;
    for (const p of pts) { ya = Math.min(ya, p[1]); yb = Math.max(yb, p[1]); }
    const rows = [];
    for (let y = Math.floor(ya); y < Math.ceil(yb); y++) {
      const yc = y + 0.5, xs = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        if ((a[1] <= yc) !== (b[1] <= yc)) xs.push(a[0] + ((yc - a[1]) / (b[1] - a[1])) * (b[0] - a[0]));
      }
      xs.sort((p, q) => p - q);
      for (let i = 0; i + 1 < xs.length; i += 2) {
        const xa = Math.ceil(xs[i] - 0.5), xb = Math.ceil(xs[i + 1] - 0.5) - 1;
        if (xb >= xa) rows.push([y, xa, xb]);
      }
    }
    return rows;
  }

  // Light comes from the upper-left, a little toward the viewer.
  const LX = -0.5, LY = -0.62, LZ = 0.6;

  // Rasterise a pile of ellipsoid "puffs" (painter's order: later = nearer) with toon
  // shading. list: [cx, cy, rx, ry?]. o.tones: palette indices light -> dark, o.thr:
  // descending thresholds between them. o.grad: [from, to] ambient added across the pile
  // (down it, and with o.gx also from left to right, so the whole mass turns from light
  // into shade), o.flat: >1 flattens each puff (thinner shade crescents), o.clip: base row
  // (number or x => row), o.dith: per-threshold half-width of an ordered-dither fringe.
  function puffs(L, list, o) {
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const p of list) {
      const rx = p[2], ry = p[3] || rx;
      x0 = Math.min(x0, Math.floor(p[0] - rx)); x1 = Math.max(x1, Math.ceil(p[0] + rx));
      y0 = Math.min(y0, Math.floor(p[1] - ry)); y1 = Math.max(y1, Math.ceil(p[1] + ry));
    }
    x0--; x1++; y0--; y1++; // 1px margin so the hole-fill can walk around the pile
    const clip = o.clip == null ? null : typeof o.clip === 'function' ? o.clip : () => o.clip;
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
    const v = new Float32Array(bw * bh).fill(NaN);
    const fl = o.flat || 1;
    for (const p of list) {
      const cx = p[0], cy = p[1], rx = p[2], ry = p[3] || rx;
      const ya = Math.floor(cy - ry), yb = Math.ceil(cy + ry), xa = Math.floor(cx - rx), xb = Math.ceil(cx + rx);
      for (let x = xa; x <= xb; x++) {
        const dx = (x + 0.5 - cx) / rx, yc = clip ? clip(x) : 1e9;
        for (let y = ya; y <= yb && y < yc; y++) {
          const dy = (y + 0.5 - cy) / ry, q = dx * dx + dy * dy;
          if (q > 1) continue;
          const nz = Math.sqrt(1 - q) * fl;
          v[(y - y0) * bw + (x - x0)] = (dx * LX + dy * LY + nz * LZ) / Math.sqrt(q + nz * nz);
        }
      }
    }
    const top = o.top != null ? o.top : y0, base = o.base != null ? o.base : y1;
    const g0 = o.grad ? o.grad[0] : 0, g1 = o.grad ? o.grad[1] : 0, gx = o.gx || 0, thr = o.thr, dith = o.dith;
    const out = new Uint8Array(bw * bh);
    for (let y = y0; y <= y1; y++) {
      const ty = Math.min(1, Math.max(0, (y - top) / Math.max(1, base - top)));
      for (let x = x0; x <= x1; x++) {
        const i = (y - y0) * bw + (x - x0);
        if (v[i] !== v[i]) continue;
        const t = ty * (1 - gx) + ((x - x0) / bw) * gx, val = v[i] + g0 + (g1 - g0) * t - (o.foot || 0) * Math.max(0, ty * 5 - 4), dd = (d2(x, y) - 0.5) * 2;
        let k = 0;
        while (k < thr.length && val + (dith ? dd * (dith[k] || 0) : 0) < thr[k]) k++;
        out[i] = k + 1;
      }
    }
    // fill enclosed holes with the darkest tone (flood the outside, whatever is left is a hole)
    const seen = new Uint8Array(bw * bh), st = [0];
    seen[0] = 1;
    while (st.length) {
      const i = st.pop(), x = i % bw, y = (i / bw) | 0;
      for (const j of [x > 0 ? i - 1 : -1, x < bw - 1 ? i + 1 : -1, y > 0 ? i - bw : -1, y < bh - 1 ? i + bw : -1])
        if (j >= 0 && !seen[j] && !out[j]) { seen[j] = 1; st.push(j); }
    }
    for (let i = 0; i < out.length; i++) if (!out[i] && !seen[i]) out[i] = o.hole || thr.length + 1;
    // tidy (three rounds, each can expose work for the next): no 1px nubs on the
    // silhouette; tone slivers and blobs smaller than o.blob px melt into their surroundings
    const at = (x, y) => (x < 0 || y < 0 || x >= bw || y >= bh ? 0 : out[y * bw + x]);
    const minB = o.blob || 6;
    for (let pass = 0; pass < 3; pass++) {
      for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
        const c = out[y * bw + x];
        if (!c) continue;
        const n = [at(x - 1, y), at(x + 1, y), at(x, y - 1), at(x, y + 1)];
        if (n.filter(Boolean).length <= 1) { out[y * bw + x] = 0; continue; }
        if (dith) continue;
        if (n.filter(q => q === c).length < 2) {
          const cnt = {};
          let best = c, bn = 0;
          for (const q of n) if (q && q !== c) { cnt[q] = (cnt[q] || 0) + 1; if (cnt[q] > bn) { bn = cnt[q]; best = q; } }
          out[y * bw + x] = best;
        }
      }
      if (dith) continue;
      const lab = new Uint8Array(bw * bh);
      for (let s0 = 0; s0 < out.length; s0++) {
        if (!out[s0] || lab[s0]) continue;
        const c = out[s0], comp = [s0], cnt = {};
        lab[s0] = 1;
        for (let h = 0; h < comp.length; h++) {
          const i = comp[h], x = i % bw;
          for (const j of [x > 0 ? i - 1 : -1, x < bw - 1 ? i + 1 : -1, i - bw, i + bw]) {
            if (j < 0 || j >= out.length || !out[j]) continue;
            if (out[j] === c) { if (!lab[j]) { lab[j] = 1; comp.push(j); } } else cnt[out[j]] = (cnt[out[j]] || 0) + 1;
          }
        }
        if (comp.length >= minB) continue;
        let best = 0, bn = 0;
        for (const k in cnt) if (cnt[k] > bn) { bn = cnt[k]; best = +k; }
        if (best) for (const i of comp) out[i] = best;
      }
    }
    for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
      const c = out[y * bw + x];
      if (c) L.set(x + x0, y + y0, o.tones[Math.min(o.tones.length, c) - 1]);
    }
  }

  // ===================== sky =====================
  function makeSky() {
    const L = layer(W, H);
    const cols = CS(['#2260cc', '#2a72d8', '#3384e2', '#3e97ea', '#4eaaf0', '#62bcf5', '#7accf8', '#96dbfa', '#b2e8fb', '#ccf1f8', '#e2f7ee', '#f6f6da']);
    vramp(L, 0, cols, [6, 8, 6, 6, 4, 2, 2, 2, 0, 0, 0, 300]);
    return L;
  }

  // ===================== clouds =====================
  // A cumulus is authored as lobes [dx, up, r, bumps?] relative to its base line
  // (up = centre height). bumps: [[angleDeg, r], ...] small puffs tucked BEHIND the lobe's
  // rim, so they only break up its silhouette and never clutter its lit face.
  function cumulus(L, ox, oy, lobes, o, sag) {
    const list = [];
    let top = 1e9;
    for (const b of lobes) {
      const cx = ox + b[0], cy = oy - b[1], r = b[2];
      if (typeof b[3] === 'number') { list.push([cx, cy, r, b[3]]); continue; }
      for (const bp of b[3] || []) {
        const a = (bp[0] * Math.PI) / 180, d = r - bp[1] * 0.35;
        list.push([cx + Math.cos(a) * d, cy - Math.sin(a) * d, bp[1]]);
      }
      list.push([cx, cy, r]);
      top = Math.min(top, cy - r);
    }
    const clip = x => { let d = 0; for (const g of sag || []) if (x >= ox + g[0] && x < ox + g[1]) d = Math.max(d, g[2]); return oy + d; };
    puffs(L, list, Object.assign({ top, base: oy, clip }, o));
  }
  // dissolve the lower rows of a layer into haze colour c (ordered 25/50/75%)
  function fade(L, ya, yb, c) {
    for (let y = ya; y < L.h; y++) {
      const f = Math.min(1, (Math.floor(((y - ya) / (yb - ya)) * 4) + 1) / 4);
      for (let x = 0; x < L.w; x++) if (L.d[y * L.w + x] && f > d2(x, y)) L.d[y * L.w + x] = c;
    }
  }

  const HERO = { tones: CS(['#fffff6', '#e8f3fe', '#c6dbf8', '#a2bef0', '#869fe6']), thr: [0.84, 0.3, -0.12, -0.62], grad: [0.3, -0.6], gx: 0.3, flat: 1.9, foot: 0.5, blob: 12 };
  const SMALL = { tones: CS(['#fffff6', '#e8f3fe', '#c6dbf8', '#a2bef0']), thr: [0.6, 0.0, -0.5], grad: [0.35, -0.5], gx: 0.2, flat: 1.7 };

      [33, 25, 14, [[150, 5], [105, 5]]],
      [88, 38, 15, [[80, 5], [35, 5]]],
      [108, 27, 13, [[60, 4], [15, 4]]],
      [124, 16, 11, [[50, 4]]],
      [44, 14, 15], [70, 12, 14], [94, 8, 11], [25, 6, 9], [114, 5, 8], [160, 3, 6],
    ], HERO, [[24, 62, 1], [34, 52, 2], [82, 128, 1], [94, 116, 2]]);

      [6, 3, 5], [120, 2, 3], [110, 4, 5], [20, 9, 9, [[130, 3]]], [96, 8, 8, [[40, 3]]],
      [38, 15, 11, [[110, 4], [60, 4]]], [58, 18, 12, [[95, 4], [45, 4]]], [78, 14, 10, [[60, 4]]],
      [30, 4, 7], [48, 5, 9], [68, 4, 8], [86, 3, 6],
    ], HERO, [[30, 90, 1]]);

      [28, 2, 22, 5],
      [3, 2, 3], [52, 4, 5], [12, 6, 7], [24, 13, 10, [[140, 3], [80, 4]]], [40, 10, 8, [[50, 3]]],
      [22, 3, 6], [36, 3, 5],
    ], SMALL);

    cumulus(L, 706, 64, [[14, 1, 10, 3], [6, 3, 3], [22, 3, 3], [14, 4, 5]], SMALL);

  }

  // Far cloud bank: cumulus towers rising from behind the horizon, plus ranks of tiny
  // flat-based clouds that shrink toward it (the classic depth cue).
  function makeBank() {
    const L = layer(768, 96);
    const BANK = { tones: CS(['#fffdf0', '#e6f0f6', '#cfe2f6', '#b6d1f0']), thr: [0.84, 0.3, -0.12], grad: [0.3, -0.6], gx: 0.3, flat: 1.9, blob: 12 };
    const TINY = { tones: CS(['#fffdf0', '#e6f0f6', '#cfe2f6']), thr: [0.5, -0.15], grad: [0.3, -0.5], flat: 1.8, blob: 4 };
    const tower = lobes => cumulus(L, 0, 96, lobes, Object.assign({ clip: null }, BANK));
    const tiny = (x, up, k) => cumulus(L, x, 96 - up, [
      [[13, 1, 11, 3], [5, 2, 3], [21, 2, 3], [11, 4, 5], [17, 3, 4]],
      [[9, 1, 8, 2], [4, 2, 3], [14, 2, 2], [9, 3, 4]],
      [[5, 1, 5, 2], [3, 1, 2], [6, 2, 3]],
    ][k], TINY);
    tower([
      [112, 4, 70, 14],
      [170, 10, 9], [40, 9, 8], [56, 16, 11, [[135, 4]]], [150, 18, 12, [[50, 4]]],
      [100, 34, 18, [[150, 5], [105, 6], [60, 5]]], [76, 26, 13, [[140, 4], [95, 4]]], [128, 28, 14, [[70, 5], [25, 4]]],
      [90, 14, 14], [114, 12, 13], [136, 8, 11], [68, 8, 10], [156, 5, 8], [50, 4, 7],
    ]);
    tower([[300, 3, 40, 9], [268, 7, 7], [336, 7, 7], [302, 20, 12, [[125, 4], [65, 4]]], [284, 13, 10, [[140, 3]]], [320, 13, 10, [[45, 3]]], [294, 8, 9], [312, 7, 8]]);
    tower([
      [516, 4, 86, 16],
      [596, 10, 10], [452, 10, 9], [436, 5, 6], [610, 4, 6], [474, 20, 12, [[140, 4]]], [576, 20, 13, [[55, 4], [15, 4]]],
      [524, 40, 20, [[160, 5], [120, 6], [80, 6], [40, 5]]], [498, 30, 15, [[145, 5], [100, 4]]], [552, 32, 15, [[70, 5], [30, 5]]],
      [510, 16, 15], [538, 15, 14], [486, 9, 11], [562, 9, 11], [524, 6, 10], [466, 4, 7], [584, 4, 8],
    ]);
    tower([[706, 3, 40, 10], [670, 8, 8], [742, 8, 8], [704, 24, 14, [[135, 5], [75, 5]]], [686, 16, 11, [[150, 4]]], [724, 17, 11, [[45, 4]]], [698, 9, 10], [716, 8, 9]]);
    for (const [x, up, k] of [[210, 22, 0], [366, 24, 0], [626, 22, 0], [196, 15, 1], [238, 14, 1], [392, 16, 1], [644, 14, 1], [752, 15, 1], [6, 14, 1],
      [226, 10, 2], [352, 11, 2], [410, 10, 2], [660, 10, 2], [22, 10, 2], [380, 11, 2]]) tiny(x, up, k);
    return L;
  }

  // ===================== sea =====================
  const SEA = CS(['#2456c2', '#2864cc', '#2c74d6', '#3086de', '#3498e2', '#38aae2', '#3ebade', '#4ac8d8', '#5cd4d0', '#74e0cc', '#92ead0']);
  const GL = C('#f6ffff'), GL2 = C('#b4e6fc');
  // rows of water, given as a string of ramp digits (line-interleaved gradient = no shimmer when scrolling)
  function water(L, y, seq) {
    for (const ch of seq) { L.row(0, L.w - 1, y++, SEA[parseInt(ch, 36)]); if (y >= L.h) break; }
    return y;
  }
  function dashRow(L, rnd, y, cell, lmin, lmax, skip, core, tip) {
    const n = Math.round(L.w / cell), cw = L.w / n;
    for (let i = 0; i < n; i++) {
      const len = lmin + Math.floor(rnd() * (lmax - lmin + 1)), x = Math.floor(i * cw + rnd() * Math.max(1, cw - len - 1));
      if (rnd() < skip) continue;
      for (let k = 0; k < len; k++) L.set(x + k, y, tip && len > 2 && (k === 0 || k === len - 1) ? tip : core);
    }
  }

  // Faceted mountain: ridge polyline [x, y, 'p'|'v'?]; 'p' peaks grow a zig-zag spine,
  // 'v' valleys a gully. Left of a spine = lit face, right of it (up to the gully) = shade.
  function zig(x, y0, y1, pat) {
    const out = new Float32Array(Math.max(1, y1 - y0 + 1));
    let k = 0, left = pat[0][0];
    for (let y = y0; y <= y1; y++) {
      out[y - y0] = x;
      x += pat[k][1];
      if (--left <= 0) { k = (k + 1) % pat.length; left = pat[k][0]; }
    }
    return out;
  }
  function mountain(L, base, ptsUp, pal, o) {
    o = o || {};
    const pts = ptsUp.map(p => [p[0], base - p[1], p[2]]);
    const xa = pts[0][0], xb = pts[pts.length - 1][0];
    const top = new Int16Array(xb - xa + 1).fill(base);
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      for (let x = a[0]; x <= b[0]; x++) top[x - xa] = Math.round(a[1] + (b[1] - a[1]) * (b[0] === a[0] ? 0 : (x - a[0]) / (b[0] - a[0])));
    }
    const div = [];
    for (const p of pts) {
      if (p[2] === 'p') div.push({ k: 'S', y0: p[1], x: zig(p[0] + 0.5, p[1], base, o.spine || [[6, 0.5], [3, -0.34]]) });
      if (p[2] === 'v') div.push({ k: 'G', y0: p[1], x: zig(p[0] + 0.5, p[1], base, o.gully || [[5, -0.6], [2, 0.3]]) });
    }
    for (let i = 0; i < div.length - 1; i++) {
      const s = div[i], g = div[i + 1];
      if (s.k !== 'S' || g.k !== 'G') continue;
      for (let y = g.y0; y < base; y++) if (s.x[y - s.y0] >= g.x[y - g.y0]) { s.y1 = g.y1 = y; break; }
    }
    for (let x = xa; x <= xb; x++) for (let y = top[x - xa]; y < base; y++) {
      let best = -1e9, kind = 'G', d = 1e9;
      for (const dv of div) {
        if (y < dv.y0 || (dv.y1 != null && y >= dv.y1)) continue;
        const px = dv.x[y - dv.y0];
        if (px <= x + 0.5 && px > best) { best = px; kind = dv.k; }
        if (dv.k === 'S' && px > x + 0.5) d = Math.min(d, px - x);
      }
      // lit faces: brightest right beside their spine, mid tone further down the slope
      let c = kind === 'S' ? pal.shade : d < 3 + (y - top[x - xa]) * 0.35 || !pal.mid ? pal.lit : pal.mid;
      if (pal.haze && (base - y <= 2 || (base - y <= 4 && d2(x, y) < 0.5))) c = pal.haze;
      L.set(x, y, c);
    }
  }

  const HZ = 40; // horizon row inside the far-sea layer
  function makeSeaFar() {
    const L = layer(640, 150);
    const rnd = rng(11);
    // islands (drawn first; the sea covers their feet)
    const far = { lit: C('#c6dcf4'), shade: C('#b2cdf0'), haze: C('#d8e9f6') };
    const mid = { lit: C('#b4cff2'), mid: C('#a2c0ec'), shade: C('#88a8e2'), haze: C('#c6dbf4') };
    mountain(L, HZ, [[262, 0], [276, 3], [290, 7, 'p'], [300, 5, 'v'], [312, 9, 'p'], [330, 4], [348, 0]], far);
    mountain(L, HZ, [[536, 0], [548, 5], [556, 11, 'p'], [574, 10], [584, 8, 'v'], [592, 12, 'p'], [606, 5], [626, 0]], far);
    mountain(L, HZ, [[60, 0], [74, 3], [92, 8], [104, 16], [112, 26], [118, 30], [124, 36, 'p'], [128, 31], [134, 27, 'v'], [142, 30, 'p'], [150, 22], [158, 18, 'v'], [166, 20, 'p'], [178, 12], [196, 7], [214, 3], [230, 0]], mid);
    mountain(L, HZ, [[392, 0], [404, 6], [412, 14], [420, 22, 'p'], [426, 16, 'v'], [434, 19, 'p'], [444, 10], [458, 5], [478, 0]], mid);
    mountain(L, HZ, [[504, 0], [508, 4, 'p'], [514, 0]], mid);
    // a ring of mist round the big peak
    puffs(L, [[104, HZ - 15, 13, 3], [124, HZ - 18, 15, 3], [146, HZ - 16, 12, 2.5], [164, HZ - 13, 9, 2]], { tones: CS(['#fbfcf2', '#dfeaf6']), thr: [0.2], blob: 3 });
    // water
    let y = HZ;
    L.row(0, L.w - 1, y, C('#5a92e0'));
    dashRow(L, rnd, y, 16, 5, 13, 0.25, C('#c4e6f8'));
    y = water(L, y + 1, '1100000001001011011121121222232232333');
    while (y < L.h) L.row(0, L.w - 1, y++, SEA[3]);
    for (let r = 2; r <= 18; r++) dashRow(L, rnd, HZ + r, r < 8 ? 20 : 34, 1, r < 8 ? 3 : 5, r < 8 ? 0.35 : 0.5, r % 3 ? GL : GL2, GL2);
    return L;
  }

  function makeSeaNear() {
    const L = layer(384, 100);
    const rnd = rng(23);
    let y = 0;
    dashRow(L, rnd, 0, 12, 4, 9, 0.2, SEA[3]);
    L.row(0, L.w - 1, 2, SEA[3]);
    dashRow(L, rnd, 1, 12, 5, 10, 0.1, SEA[3]);
    y = water(L, 3, '3334334344344454454555655656667667777');
    while (y < L.h) L.row(0, L.w - 1, y++, SEA[7]);
    for (let r = 2; r <= 30; r += 2) dashRow(L, rnd, r + (r % 4 ? 1 : 0), 40, 2, 7, 0.45, r % 3 ? GL : GL2, GL2);
    return L;
  }

  // ===================== mid headlands + lagoon =====================
  const WL = 64; // waterline row inside the headland layer
  const GRASS = { tones: CS(['#bfeba4', '#8cd79e', '#60bf98', '#44a792', '#358e8e']), thr: [0.9, 0.52, 0.12, -0.3], grad: [0.22, -0.5], gx: 0.15, dith: [0.08, 0.1, 0.1, 0.1] };
  const WOOD = { tones: CS(['#98dc94', '#60c08c', '#3ea486', '#308882', '#28707c']), thr: [0.9, 0.5, 0.0, -0.5], grad: [0.15, -0.35], flat: 1.6, blob: 4 };
  const ROCK = CS(['#f8f0dc', '#e2d6d0', '#bcb2c8', '#978fb6', '#7872a2']);
  const FOAM = C('#f8ffff'), FOAM2 = C('#c6ecf8'), FOAM3 = C('#94d6f2');
  const SAND = C('#f6eebc'), SAND2 = C('#dccf9e');
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  // Rock face. pts: silhouette [x, up] (up = height above the waterline row `base`).
  // o.folds: fold lines [[x, up], ...] running top -> bottom; they split the face into
  // planes toned by o.tones (lit / shade alternating). A ridge (lit plane meeting a darker
  // one) catches a highlight, a crease gets a dark crack. o.strata: [[up, xa, xb]] bedding
  // lines, o.cracks: [[x, upTop, upBottom]], o.cap: rows of shade under overhanging growth.
  function cliff(L, base, pts, o) {
    const rows = polyRows(pts.map(p => [p[0], base - p[1]])), topY = {};
    for (const [y, x0, x1] of rows) for (let x = x0; x <= x1; x++) if (topY[x] == null) topY[x] = y;
    const fx = (fl, y) => {
      const up = base - y;
      if (up >= fl[0][1]) return fl[0][0];
      for (let i = 0; i < fl.length - 1; i++) {
        const p = fl[i], q = fl[i + 1];
        if (up <= p[1] && up >= q[1]) return p[0] + ((p[1] - up) / Math.max(1e-6, p[1] - q[1])) * (q[0] - p[0]);
      }
      return fl[fl.length - 1][0];
    };
    const plane = (x, y) => { let p = 0; for (const fl of o.folds) if (fx(fl, y) <= x) p++; return p; };
    const darker = (x, y, n) => { const i = ROCK.indexOf(L.get(x, y)); if (i >= 0) L.set(x, y, ROCK[Math.min(4, i + n)]); };
    for (const [y, x0, x1] of rows) for (let x = x0; x <= x1; x++) {
      const p = plane(x, y), pn = x < x1 ? plane(x + 1, y) : p;
      let t = o.tones[p];
      const capped = y - topY[x] < (o.cap || 0);
      if (pn !== p) t += o.tones[pn] > t ? -1 : 1;
      else if (x === x0 && t <= 2 && !capped) t--;
      if (capped) t++;
      if (base - y <= 2) t++;
      L.set(x, y, ROCK[clamp(t, 0, 4)]);
    }
    for (const [up, xa, xb] of o.strata || []) for (let x = xa; x <= xb; x++) darker(x, base - up, 1);
    for (const h of o.holes || []) {
      // see-through arch [x, w, height]: rounded opening, its left + top inner wall in shade
      const [hx, hw, hh] = h, r = hw / 2;
      const inside = (x, up, k) => { const dx = x + 0.5 - (hx + r + k), top = hh - r - k; return up >= 0 && Math.abs(dx) <= r && (up <= top || dx * dx + (up - top) * (up - top) <= r * r); };
      for (let up = 0; up <= hh + 1; up++) for (let x = hx - 3; x <= hx + hw + 3; x++) {
        if (inside(x, up + 0.5, 0)) L.set(x, base - 1 - up, inside(x, up + 2.5, 2) ? 0 : ROCK[4]);
      }
    }
    for (const [x, ua, ub] of o.cracks || []) for (let up = ub; up <= ua; up++) darker(x, base - up, 2);
  }
  // Waterfall: long white streaks between paler edges, a lip on top, mist at its foot.
  const FPH = [0, 7, 3, 10, 5, 1, 8, 4];
  function falls(L, x, y0, y1, w, mist) {
    for (let i = 0; i < w; i++) for (let y = y0; y < y1; y++) {
      const edge = i === 0 || i === w - 1, ph = (y - y0 + FPH[i % 8]) % 12;
      L.set(x + i, y, edge ? (ph < 7 ? FOAM2 : FOAM3) : ph < 9 ? FOAM : FOAM2);
    }
    L.row(x - 1, x + w, y0, FOAM); L.row(x, x + w - 1, y0 + 1, FOAM);
    L.col(x + w, y0 + 1, y1 - 1, ROCK[4]);
    if (mist) puffs(L, mist.map(m => [x + m[0], y1 - m[1], m[2]]), { tones: [FOAM, FOAM2], thr: [-0.3], grad: [0.3, -0.3], blob: 3 });
  }
  // Tiny far palms (a = lit frond, b = frond, t = trunk, c = lit trunk)
  const PALM_S = [
    ['....aa...aa....', '..aabba.abbaa..', '.abbbbbabbbbba.', 'abb.bbbtbbb.bba', 'bb..bb.t.bb..bb', 'b...b..t..b...b', '.......t.......', '......ct.......', '......t........', '......t........', '.....ct........', '.....t.........', '.....t.........'],
    ['...aaa...aa...', '.aabbba.abbaa.', 'abb.bbbabbbbba', 'bb..bbtbb..bbb', 'b..bb.t.bb..bb', '...b..t..b...b', '.....ct.......', '.....t........', '....ct........', '....t.........', '....t.........'],
  ];

  // Ancient stepped sun temple, far away on a hilltop (base row `by`, centred on cx).
  function ziggurat(L, cx, by) {
    let y = by;
    for (const [w, h] of [[27, 4], [21, 4], [15, 4], [9, 3], [5, 4]]) {
      const x0 = cx - (w >> 1);
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
        let t = i >= w - Math.ceil(w / 4) ? 3 : 2;
        if (j === 0) t = i >= w - Math.ceil(w / 4) ? 2 : 0; else if (i === 0) t = 1;
        if (Math.abs(x0 + i - cx) <= 1 && w > 5) t = j === 0 ? 0 : x0 + i - cx === 1 ? 3 : 1; // the stair
        L.set(x0 + i, y - h + j, ROCK[t]);
      }
      y -= h;
    }
    L.row(cx - 3, cx + 3, y, ROCK[0]); L.row(cx - 2, cx + 2, y - 1, ROCK[1]);
    L.col(cx, y + 2, y + 3, ROCK[4]);
  }

  function makeHills() {
    const L = layer(1024, 152);
    const rnd = rng(31);
    const PM = { a: WOOD.tones[0], b: WOOD.tones[2], c: C('#a09cb0'), t: C('#74709a') };
    let ox = 0;
    // rolling mound: upper cap of an ellipse [x, sink, rx, ry] (centre `sink` px under water)
    const hill = (...ms) => { for (const m of ms) puffs(L, [[ox + m[0], WL + m[1], m[2], m[3]]], Object.assign({ clip: WL, top: WL + m[1] - m[3], base: WL }, GRASS)); };
    const spit = (x, rx, ry) => puffs(L, [[ox + x, WL, rx, ry]], { clip: WL, tones: [C('#fff8d2'), SAND, SAND2], thr: [0.75, 0.2] });
    // grove: a line of n small crowns of radius ~r starting at [x, up], climbing `rise` px each
    const grove = (x, up, n, r, rise, seed) => {
      const q = rng(seed), list = [];
      let top = 1e9, bot = -1e9;
      for (let i = 0; i < n; i++) {
        const cx = ox + x + i * r * 1.35 + (q() - 0.5) * 2, cy = WL - (up + i * rise + (q() - 0.5) * 2), rr = r + (q() < 0.4 ? 1 : 0);
        for (const ang of [135, 55]) if (q() < 0.75) { const g = (ang * Math.PI) / 180; list.push([cx + Math.cos(g) * rr * 0.8, cy - Math.sin(g) * rr * 0.8, rr * 0.55]); }
        list.push([cx, cy, rr, rr * 0.85]);
        top = Math.min(top, cy - rr * 1.3); bot = Math.max(bot, cy + rr);
      }
      puffs(L, list, Object.assign({ clip: WL, top, base: bot }, WOOD));
    };
    const palmS = (x, up, k, flip) => stamp(L, ox + x - (flip ? PALM_S[k][0].length - 1 - 6 : 6), WL - up - PALM_S[k].length + 1, PALM_S[k], PM, flip);
    const boulders = list => puffs(L, list.map(p => [ox + p[0], WL - p[1], p[2], p[3]]), { tones: [ROCK[1], ROCK[2], ROCK[3]], thr: [0.55, -0.1], clip: WL, blob: 3 });
    const vines = list => { for (const [x, up, n] of list) L.col(ox + x, WL - up, WL - up + n - 1, WOOD.tones[3]); };
    const rockface = (pts, o) => cliff(L, WL, pts.map(p => [ox + p[0], p[1]]), Object.assign({}, o, {
      folds: o.folds.map(fl => fl.map(p => [ox + p[0], p[1]])), strata: (o.strata || []).map(q => [q[0], ox + q[1], ox + q[2]]),
      cracks: (o.cracks || []).map(q => [ox + q[0], q[1], q[2]]), holes: (o.holes || []).map(q => [ox + q[0], q[1], q[2]]) }));
    const fall = (x, up, w, mist) => falls(L, ox + x, WL - up, WL, w, mist);

    // ---- headland A: table mountain with the twin falls ----
    ox = 50;
    spit(20, 26, 4);
    hill([150, 30, 76, 68], [56, 12, 40, 28], [88, 16, 40, 40]);
    grove(60, 17, 3, 4, 1.5, 1); grove(78, 23, 3, 5, 1, 21);
    rockface([[100, 0], [101, 9], [104, 11], [105, 24], [107, 26], [108, 38], [110, 41], [113, 44], [124, 45], [136, 44], [150, 46], [158, 44], [160, 41], [161, 30], [164, 28], [178, 28], [181, 26], [182, 14], [185, 11], [186, 0]], {
      folds: [[[120, 46], [120, 30], [121, 28], [121, 12], [122, 10], [122, 0]], [[127, 46], [127, 0]], [[151, 46], [151, 32], [152, 30], [152, 16], [154, 14], [154, 0]],
        [[161, 46], [161, 30], [160, 28], [160, 14], [162, 12], [162, 0]], [[174, 28], [174, 14], [176, 12], [176, 0]]],
      tones: [1, 3, 1, 3, 2, 4], cap: 3,
      strata: [[30, 106, 118], [29, 136, 149], [14, 103, 119], [13, 135, 152], [12, 163, 173], [21, 141, 150], [36, 109, 114]],
      cracks: [[112, 41, 37], [143, 20, 15], [110, 8, 3], [146, 43, 38], [168, 24, 18], [115, 24, 17]],
    });
    fall(128, 45, 6, [[-4, 1, 3], [3, 2, 4], [9, 1, 3], [-1, 4, 2], [6, 5, 3], [2, 6, 2]]);
    fall(166, 28, 3, [[-2, 1, 2], [2, 2, 3], [5, 1, 2]]);
    vines([[106, 37, 4], [116, 43, 6], [139, 43, 5], [147, 44, 3], [156, 42, 6], [171, 27, 4]]);
    grove(124, 52, 4, 5, 0.5, 3); grove(111, 46, 3, 5, 1, 4); grove(137, 47, 4, 5, 0.3, 5); grove(162, 29, 3, 3, 0, 6);
    palmS(118, 53, 1); palmS(150, 53, 0, true);
    boulders([[98, 1, 3], [118, 0, 3], [140, 1, 4, 3], [158, 1, 3], [189, 0, 3]]);
    hill([214, 14, 38, 38], [246, 12, 36, 26]);
    spit(280, 24, 4);
    grove(204, 22, 3, 5, 0.5, 8); grove(236, 15, 3, 4, -1, 22);
    palmS(14, 3, 0); palmS(26, 3, 1, true); palmS(70, 21, 1); palmS(258, 11, 0, true); palmS(284, 3, 1); palmS(294, 2, 0, true);

    // ---- a palm islet ----
    ox = 0;
    spit(420, 16, 3); grove(414, 3, 2, 3, 0, 31); palmS(418, 3, 0); palmS(426, 2, 1, true);

    // ---- island B: rolling hills crowned by the sun temple ----
    ox = 470;
    spit(8, 22, 4);
    hill([112, 22, 56, 62], [40, 12, 40, 26]);
    ziggurat(L, ox + 76, WL - 22);
    hill([78, 16, 34, 38]);
    grove(62, 22, 3, 4, 0.5, 9); grove(84, 22, 3, 4, -0.5, 10);
    hill([150, 16, 44, 36], [186, 10, 34, 20]);
    grove(104, 40, 4, 5, 0, 11); grove(140, 21, 3, 5, -1, 23); grove(28, 14, 3, 4, 1, 24);
    spit(214, 20, 3);
    palmS(4, 3, 0); palmS(14, 3, 1, true); palmS(50, 15, 1); palmS(128, 38, 0, true); palmS(176, 12, 1); palmS(198, 8, 0, true); palmS(220, 2, 1);

    // ---- sea stacks + the arch ----
    ox = 0;
    rockface([[745, 0], [746, 8], [749, 12], [749, 26], [752, 30], [760, 31], [763, 26], [764, 12], [767, 9], [768, 0]], { folds: [[[757, 31], [757, 14], [759, 12], [759, 0]]], tones: [1, 3], strata: [[14, 750, 756], [22, 750, 756]] });
    rockface([[771, 0], [772, 10], [774, 15], [780, 16], [783, 11], [784, 0]], { folds: [[[779, 16], [779, 0]]], tones: [1, 3], strata: [[8, 773, 778]] });
    grove(753, 31, 2, 3, 0, 12);
    boulders([[742, 0, 3], [769, 1, 3], [786, 0, 2]]);
    rockface([[800, 0], [801, 8], [804, 12], [805, 19], [809, 23], [822, 26], [836, 25], [842, 21], [844, 12], [847, 9], [848, 0]], {
      folds: [[[812, 27], [812, 16], [814, 14], [814, 0]], [[817, 27], [817, 0]], [[836, 27], [836, 12], [838, 10], [838, 0]]],
      tones: [1, 3, 1, 3], strata: [[18, 806, 811], [19, 820, 834], [9, 802, 812]], holes: [[819, 14, 15]],
    });
    grove(810, 25, 4, 3, 0.3, 32); palmS(828, 26, 1);
    boulders([[798, 0, 3], [850, 0, 3]]);

    // ---- headland D: the green bluff ----
    ox = 16;
    spit(858, 20, 3);
    hill([940, 28, 74, 76], [886, 12, 36, 28]);
    rockface([[910, 0], [911, 9], [915, 12], [916, 24], [920, 27], [922, 34], [944, 39], [948, 36], [949, 20], [953, 17], [954, 0]], {
      folds: [[[928, 40], [928, 26], [929, 24], [929, 0]], [[933, 40], [933, 0]], [[944, 40], [944, 22], [946, 20], [946, 0]]],
      tones: [1, 3, 1, 3], cap: 3, strata: [[24, 917, 927], [12, 912, 928], [22, 939, 943], [11, 940, 945]], cracks: [[922, 30, 26], [940, 34, 29]],
    });
    fall(934, 37, 4, [[-3, 1, 3], [2, 2, 3], [6, 1, 2], [1, 4, 2]]);
    vines([[918, 28, 4], [925, 35, 5], [941, 38, 4], [947, 36, 3]]);
    grove(916, 37, 3, 5, 1.5, 13); grove(938, 42, 5, 5, 0.5, 14);
    hill([988, 16, 40, 36]);
    grove(970, 30, 3, 5, -2, 15);
    palmS(960, 47, 0); palmS(856, 3, 1); palmS(866, 2, 0, true); palmS(1004, 14, 0, true); palmS(882, 14, 1);
    boulders([[908, 0, 3], [930, 1, 3], [955, 0, 3]]);
    ox = 0;

    // ---- beaches: pale sand where grass meets the water ----
    const grassy = new Set(GRASS.tones.concat(WOOD.tones));
    for (let x = 0; x < L.w; x++) {
      const c = L.get(x, WL - 1);
      if (grassy.has(c)) { L.set(x, WL - 1, SAND); if (grassy.has(L.get(x, WL - 2)) && (x * 7) % 11 < 7) L.set(x, WL - 2, SAND2); }
    }
    // ---- lagoon ----
    const land = new Uint8Array(L.w);
    for (let x = 0; x < L.w; x++) { const c = L.get(x, WL - 1); land[x] = !c ? 0 : c === SAND || c === SAND2 ? 1 : c === FOAM || c === FOAM2 ? 3 : 2; }
    let y = water(L, WL, '7778778788788898898999a99a9aaa');
    while (y < L.h) L.row(0, L.w - 1, y++, SEA[10]);
    // reef line where the open sea meets the lagoon, reflections under the land
    const REFL = [0, C('#42b4b0'), C('#7f9cc4'), C('#d6f6f6')];
    for (let r = 0; r < 5; r++) {
      let on = 0, n = 0;
      for (let x = 0; x < L.w; x++) {
        if (n-- <= 0) { on = rnd() < 0.86 - r * 0.2; n = on ? 3 + Math.floor(rnd() * 8) : 1 + Math.floor(rnd() * (2 + r * 2)); }
        if (land[x] && on) L.set(x, WL + r, REFL[land[x]]);
      }
    }
    for (let x = 0; x < L.w; x++) if (!land[x] && (x * 5) % 23 < 15) L.set(x, WL, C('#bfeef0'));
    for (let r = 4; r <= 44; r += 3) dashRow(L, rnd, WL + r + (r & 1), 60, 3, 9, 0.4, GL, C('#c8f6ee'));
    return L;
  }

  // ===================== near jungle =====================
  // Palm: curved trunk rising h px from (x, y), crown of arching fronds with hanging leaflets.
  function palm(L, x, y, h, lean, R, c) {
    for (let i = 0; i <= h; i++) {
      const t = i / h, px = Math.round(x + lean * t * t), wd = t < 0.35 ? 3 : 2;
      for (let k = 0; k < wd; k++) L.set(px + k, y - i, k === 0 ? c.trunkLit : i % 4 === 0 ? c.trunkDark : c.trunk);
    }
    const tx = Math.round(x + lean) + 1, ty = y - h;
    // [start angle, length factor, total bend, tone] — drooping back fronds first, upright last
    const F = [[205, 0.7, 50, 2], [-25, 0.7, 50, 2], [168, 1.05, 78, 1], [12, 1.05, 78, 2], [128, 1, 88, 0], [52, 1, 88, 1], [98, 0.6, 45, 0], [78, 0.55, 50, 1]];
    for (const [a0, lf, bend, tone] of F) {
      const len = R * lf, sign = a0 > 90 ? 1 : -1;
      let fx = tx, fy = ty, lastX = null;
      for (let d = 0; d <= len; d += 0.5) {
        const sN = d / len, ang = ((a0 + sign * bend * Math.pow(sN, 1.4)) * Math.PI) / 180;
        fx += Math.cos(ang) * 0.5; fy -= Math.sin(ang) * 0.5;
        const px = Math.floor(fx), py = Math.floor(fy);
        if (px !== lastX) {
          lastX = px;
          let ll = Math.round(3.4 * Math.pow(Math.sin(Math.PI * Math.min(1, 0.1 + sN * 0.9)), 0.7) * Math.sqrt(Math.abs(Math.cos(ang))));
          if (px & 1) ll -= 1;
          for (let k = 1; k <= ll; k++) L.set(px, py + k, c.leaf[Math.min(3, tone + (k > 1 ? 2 : 1))]);
        }
        L.set(px, py, c.leaf[tone]);
      }
    }
    for (let k = -1; k <= 1; k++) L.set(tx + k, ty + 1, c.trunkDark);
  }

  function makeJungle() {
    const L = layer(768, 128);
    const JF = { tones: CS(['#62c47c', '#3ca66e', '#268864', '#1d6c5c', '#185652']), thr: [0.93, 0.6, 0.1, -0.5], grad: [0.2, -0.5], flat: 2 };
    const JB = { tones: CS(['#68c090', '#46a682', '#338c7a', '#297572']), thr: [0.9, 0.45, -0.2], grad: [0.2, -0.5], flat: 2 };
    const JD = { tones: [JF.tones[2], JF.tones[3], JF.tones[4]], thr: [0.75, 0.0], grad: [0.1, -0.5], flat: 2 };
    const JE = { tones: [JF.tones[3], JF.tones[4]], thr: [0.6], grad: [0.1, -0.4], flat: 2 };
    const PC = { trunk: C('#6a5c66'), trunkLit: C('#9a8c80'), trunkDark: C('#4a4258'), leaf: [JF.tones[0], JF.tones[1], JF.tones[2], JF.tones[3]] };
    const PB = { trunk: C('#6c7480'), trunkLit: C('#94a098'), trunkDark: C('#566070'), leaf: [JB.tones[0], JB.tones[1], JB.tones[2], JB.tones[3]] };
    // Top line of the front canopy: two tall clumps, two bays where the lagoon shows through.
    const KP = [[0, 56], [70, 46], [130, 42], [190, 52], [250, 68], [310, 72], [370, 56], [430, 44], [480, 40], [540, 50], [600, 62], [650, 70], [700, 66], [740, 60], [768, 56]];
    const prof = x => {
      x = ((x % 768) + 768) % 768;
      let i = 0;
      while (x > KP[i + 1][0]) i++;
      const t = (x - KP[i][0]) / (KP[i + 1][0] - KP[i][0]);
      return KP[i][1] + (KP[i + 1][1] - KP[i][1]) * (1 - Math.cos(t * Math.PI)) / 2 + 1.5 * Math.sin((x / 768) * Math.PI * 26 + 1);
    };
    const back = x => Math.min(prof(x) - 7, 61 + 2 * Math.sin((x / 768) * Math.PI * 14));
    const crowns = (o, line, lift, seed, rmin, rmax) => {
      const r2 = rng(seed);
      for (let x = 0; x < 768;) {
        const rx = rmin + Math.floor(r2() * (rmax - rmin + 1)), ry = Math.round(rx * 0.72), cx = x + rx * 0.7, top = line(cx) - lift + Math.floor(r2() * 4);
        const list = [];
        for (const a of [150, 115, 75, 35]) if (r2() < 0.7) { const rb = 3 + Math.floor(r2() * 2), q = (a * Math.PI) / 180; list.push([cx + Math.cos(q) * (rx - 1), top + ry - Math.sin(q) * (ry - 1), rb]); }
        list.push([cx, top + ry, rx, ry]);
        puffs(L, list, Object.assign({ top: top - 3, base: top + ry * 2 }, o));
        x += rx * 1.25;
      }
    };
    // a big broadleaf tree standing clear of the canopy
    const tree = (x, h, o, c) => {
      const y = Math.round(prof(x)) + 6;
      for (let i = 0; i < h; i++) { L.set(x, y - i, c.trunkLit); L.set(x + 1, y - i, c.trunk); L.set(x + 2, y - i, i % 5 === 2 ? c.trunkDark : c.trunk); }
      L.set(x - 1, y - h + 3, c.trunk); L.set(x - 2, y - h + 2, c.trunk); L.set(x + 3, y - h + 4, c.trunk); L.set(x + 4, y - h + 3, c.trunk);
      const ty = y - h;
      const lobes = [[-9, 1, 8, 6], [9, 2, 8, 6], [-3, -6, 9, 7], [5, -5, 8, 6], [0, 0, 11, 7]];
      for (const [dx, dy, rx, ry] of lobes) {
        const cx = x + 1 + dx, cy = ty + dy;
        puffs(L, [[cx - rx * 0.6, cy - ry * 0.6, 3.5], [cx + rx * 0.5, cy - ry * 0.7, 3], [cx, cy, rx, ry]], Object.assign({ top: cy - ry - 3, base: cy + ry }, o));
      }
    };
    // back row (hazier), its palms, then the front row
    for (let x = 0; x < 768; x++) L.col(x, Math.round(back(x)) + 2, L.h - 1, JB.tones[3]);
    crowns(JB, back, 2, 3, 8, 12);
    for (const [x, h, lean, R] of [[60, 28, 4, 12], [170, 26, -4, 12], [330, 30, 4, 12], [396, 28, -5, 12], [590, 30, 4, 13], [720, 28, -4, 12]]) palm(L, x, Math.round(back(x)) + 2, h, lean, R, PB);
    tree(540, 20, JB, PB);
    for (let x = 0; x < 768; x++) L.col(x, Math.round(prof(x)) + 8, L.h - 1, JF.tones[4]);
    crowns(JF, prof, 0, 8, 8, 13);
    tree(150, 24, JF, PC); tree(472, 26, JF, PC); tree(744, 22, JF, PC);
    for (const [x, h, lean, R] of [[20, 34, -4, 15], [96, 38, 6, 17], [122, 28, -5, 15], [210, 30, 5, 14], [286, 44, -6, 16], [428, 36, -5, 17], [500, 34, 5, 15], [560, 30, -5, 14], [640, 46, 6, 16], [664, 36, -5, 14]])
      palm(L, x, Math.round(prof(x)) + 4, h, lean, R, PC);
    // understory: lower ranks of crowns sinking into the dark
    crowns(JD, prof, -15, 21, 9, 14); crowns(JE, prof, -31, 22, 10, 15); crowns(JE, prof, -49, 23, 11, 16);
    return L;
  }

  // ===================== assemble =====================
  return {
    sky: bake(makeSky()),
    layers: [
      { img: bake(makeBank()), y: 20, speed: 0.02, auto: 1 },
      { img: bake(makeFloaters()), y: 4, speed: 0.04, auto: 2.5 },
      { img: bake(makeSeaFar()), y: 108 - HZ, speed: 0.06 },
      { img: bake(makeSeaNear()), y: 120, speed: 0.11 },
      { img: bake(makeHills()), y: 130 - WL, speed: 0.22 },
      { img: bake(makeJungle()), y: 90, speed: 0.45 },
    ],
  };
});

// ---- src/art/player.js ----
// SUNFOX — Kit the fox (player sprites).
// Every frame is 32x32, facing right, feet on the bottom row, body axis on x=16.
// Kit is authored as hand-pixelled PARTS (head, torso, limbs, tail, scarf ribbon) in canvas
// coordinates; frames are composed from parts with integer offsets so volumes stay consistent
// between frames, then a "selout" pass tints the sun-facing outline with dark local colour.
G.defineArt('player', G => {
  'use strict';
  const P = G.PAL;
  const C = {
    k: P.ink, K: P.ink,                       // k = outline (may be tinted by selout), K = features (never tinted)
    o: P.orange[0], r: P.orange[1], O: P.orange[2], y: P.orange[3], Y: P.orange[4],
    w: P.white, c: P.brown[5], s: P.brown[4], u: P.brown[3],
    D: P.brown[0], d: P.brown[1], b: P.brown[2],  // dark "socks", paws, ear tips
    g: P.teal[0], t: P.teal[1], T: P.teal[2], h: P.teal[3],
    p: P.pink[1], q: P.pink[0],
  };
  const W = 32, H = 32;

  // ---------------------------------------------------------------- char-buffer toolkit
  const blank = () => Array.from({ length: H }, () => new Array(W).fill('.'));
  // A part is [firstRow, 'row', 'row', ...] in canvas coordinates ('.' transparent, '_' erases).
  function put(buf, part, dx, dy, map) {
    dx = dx || 0; dy = dy || 0;
    for (let j = 1; j < part.length; j++) {
      const row = part[j], y = part[0] + j - 1 + dy;
      if (y < 0 || y >= H) continue;
      for (let x = 0; x < row.length; x++) {
        const ch = row[x];
        if (ch === '.' || ch === ' ') continue;
        const X = x + dx;
        if (X < 0 || X >= W) continue;
        buf[y][X] = ch === '_' ? '.' : (map && map[ch]) || ch;
      }
    }
    return buf;
  }
  // Copy of a part with some canvas rows replaced: patch(part, {10: 'newrow', ...}).
  function patch(part, rows) {
    const p = part.slice();
    for (const k in rows) p[+k - part[0] + 1] = rows[k];
    return p;
  }
  // Selective outline: outline pixels on the sun side (upper-left) take a dark shade of the
  // material they wrap instead of ink.
  const MAT = {};

  'wcsu'.split('').forEach(ch => (MAT[ch] = 'd'));
  'gtTh'.split('').forEach(ch => (MAT[ch] = 'g'));
  function selout(buf) {
    const at = (x, y) => (x < 0 || y < 0 || x >= W || y >= H ? '.' : buf[y][x]);
    const out = buf.map(r => r.slice());
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (buf[y][x] !== 'k') continue;
      let nx = 0, ny = 0, edge = false;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if ((dx || dy) && at(x + dx, y + dy) === '.') { nx += dx; ny += dy; if (!dx || !dy) edge = true; }
      }
      if (!edge || -nx - ny <= 0) continue;
      const votes = {};

      }
      let best = null, bv = 0;
      for (const m in votes) if (votes[m] > bv) { bv = votes[m]; best = m; }

<script>
// ---- src/audio.js ----
// SUNFOX — audio. 100% WebAudio synthesis (no samples, no files)  ->  window.G.audio
//
//   init()            create/resume the AudioContext (call on the first user gesture; idempotent)
//   music(name)       'title' | 'level' (loops)  ·  'clear' | 'gameover' (one-shot jingles)
//   stopMusic()       fade the current music out
//   sfx(name)         jump land gem bigcoin stomp hurt die spring block checkpoint heart splash select pause
//   setMuted(bool)    / .muted
//
// Nothing touches an AudioContext before init(); every entry point is safe to call earlier
// (a music() request made before init() simply starts when init() runs).
//
// Sound design: Mega Drive flavoured 2-operator FM (bass, brass, steel-pan) + SNES/PSG flavoured
// detuned pulse lead, saw stabs, synthesised drums, tempo-synced echo. The songs are written in a
// tiny text notation (see SONGS) and played by a look-ahead scheduler locked to AudioContext.currentTime.
(function () {
  'use strict';
  const G = (window.G = window.G || {});
  const A = (G.audio = G.audio || {});
  const nop = function () {};
  A.muted = false;
  A.ready = false;
  A.init = A.music = A.stopMusic = A.sfx = A.setMuted = nop; // real ones are installed at the bottom

  // ------------------------------------------------------------------ mix
  const MIX = { master: 0.85, music: 0.5, sfx: 0.8 };
  // per-instrument strip levels (music)
  const LV = { lead: 0.2, brass: 0.2, flute: 0.26, pan: 0.2, bass: 0.34, stab: 0.085, pad: 0.06, drum: 0.5, hat: 0.2, perc: 0.3 };

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // ------------------------------------------------------------------ rack (one per AudioContext)
  function softClip() {
    // linear up to 0.62, then a tanh knee that saturates below 0.88: the output can never clip.
    const n = 2049, c = new Float32Array(n), k = 0.62, L = 0.92;
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1, a = Math.abs(x);
      const y = a <= k ? a : k + (L - k) * Math.tanh((a - k) / (L - k));
      c[i] = x < 0 ? -y : y;
    }
    return c;
  }
  function noiseBuf(ctx) {
    const n = Math.floor(ctx.sampleRate * 2), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    let s = 22222;
    for (let i = 0; i < n; i++) { s = (s * 16807) % 2147483647; d[i] = s / 1073741823.5 - 1; }
    return b;
  }
  function pulseWave(ctx, duty) {
    const N = 48, re = new Float32Array(N), im = new Float32Array(N);
    for (let k = 1; k < N; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
    return ctx.createPeriodicWave(re, im);
  }
  function makeRack(ctx, opt) {
    opt = opt || {};
    const R = { ctx: ctx, nOff: 0 };
    const g = (R.gain = v => { const n = ctx.createGain(); n.gain.value = v; return n; });
    R.out = g(A.muted && !opt.offline ? 0 : 1); // mute gate
    R.clip = ctx.createWaveShaper(); R.clip.curve = softClip();
    const c = (R.comp = ctx.createDynamicsCompressor()); // bus limiter
    c.threshold.value = -15; c.knee.value = 9; c.ratio.value = 10; c.attack.value = 0.003; c.release.value = 0.16;
    R.master = g(MIX.master);
    R.music = g(MIX.music);
    R.sfx = g(MIX.sfx);
    R.music.connect(R.master); R.sfx.connect(R.master);
    if (opt.raw) R.master.connect(R.out); // (analysis only) bypass limiter + clipper
    else { R.master.connect(c); c.connect(R.clip); R.clip.connect(R.out); }
    R.out.connect(ctx.destination);
    // short slap echo used by the "reward" sfx
    const d = ctx.createDelay(0.5), fb = g(0.32), wet = g(0.4);
    d.delayTime.value = 0.125;
    R.sfxEcho = g(1); R.sfxEcho.connect(d); d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(R.sfx);
    R.noise = noiseBuf(ctx);
    R.waves = { p25: pulseWave(ctx, 0.25), p12: pulseWave(ctx, 0.125) };
    return R;
  }

  // ------------------------------------------------------------------ primitives
  function mkOsc(R, type, f, t, end, det) {
    const o = R.ctx.createOscillator();
    if (R.waves[type]) o.setPeriodicWave(R.waves[type]); else o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (det) o.detune.value = det;
    o.start(t); o.stop(end);
    return o;
  }
  // attack (linear) -> decay to sustain (time constant dTc) -> release at tOff (time constant rTc)
  function adsr(p, t, tOff, a, peak, dTc, sus, rTc) {
    p.setValueAtTime(0, t);
    p.linearRampToValueAtTime(peak, t + a);
    p.setTargetAtTime(peak * sus, t + a, dTc);
    p.setTargetAtTime(0, tOff, rTc);
  }
  function vibrato(R, t, end, rate, cents, delay, targets) {
    const ctx = R.ctx, l = ctx.createOscillator(), lg = ctx.createGain();
    l.frequency.value = rate;
    lg.gain.setValueAtTime(0, t + delay); lg.gain.linearRampToValueAtTime(cents, t + delay + 0.12);
    l.connect(lg); for (let i = 0; i < targets.length; i++) lg.connect(targets[i].detune);
    l.start(t + delay); l.stop(end);
  }
  function noiseSrc(R, t, dur) {
    const s = R.ctx.createBufferSource(); s.buffer = R.noise;
    R.nOff = (R.nOff + 0.2371) % 1.6;
    s.start(t, R.nOff, dur + 0.03);
    return s;
  }

  // ------------------------------------------------------------------ pitched voices
  // PSG/SNES style lead: narrow pulse + slightly detuned second oscillator, delayed vibrato.
  function vPulse(R, dest, t, f, dur, vel, o) {
    const ctx = R.ctx, a = o.a || 0.005, rTc = o.rTc || 0.03;
    const tOff = Math.max(t + dur, t + a + 0.005), end = tOff + rTc * 7 + 0.02;
    const g = ctx.createGain();
    adsr(g.gain, t, tOff, a, vel, o.dTc || 0.06, o.sus == null ? 0.7 : o.sus, rTc);
    const o1 = mkOsc(R, o.wave || 'p25', f, t, end, 0), osc = [o1];
    o1.connect(g);
    if (o.mix2) {
      const o2 = mkOsc(R, o.wave2 || 'square', f * (o.mul2 || 1), t, end, o.det == null ? 9 : o.det), g2 = ctx.createGain();
      g2.gain.value = o.mix2; o2.connect(g2); g2.connect(g); osc.push(o2);
    }
    if (o.vib && dur > (o.vibDelay || 0.16) + 0.08) vibrato(R, t, end, o.vibRate || 5.8, o.vib, o.vibDelay || 0.16, osc);
    g.connect(dest);
    return g;
  }
  // Mega Drive style 2-operator FM: modulator -> carrier.frequency, with an index envelope.
  //   ratio  modulator/carrier frequency ratio      i0 -> i1 (iTc)  modulation index envelope
  //   det    cents: adds a 2nd detuned carrier      oct     level of an extra sine partial at 2f
  function vFM(R, dest, t, f, dur, vel, o) {
    const ctx = R.ctx, a = o.a || 0.004, rTc = o.rTc || 0.04;
    const tOff = Math.max(t + dur, t + a + 0.005), end = tOff + rTc * 7 + 0.02;
    const g = ctx.createGain();
    adsr(g.gain, t, tOff, a, vel, o.dTc || 0.1, o.sus == null ? 0.7 : o.sus, rTc);
    const mod = mkOsc(R, 'sine', f * o.ratio, t, end, o.mdet || 0), mg = ctx.createGain();
    const dev = f * o.ratio;
    mg.gain.setValueAtTime(o.i0 * dev, t); mg.gain.setTargetAtTime(o.i1 * dev, t, o.iTc || 0.06);
    mod.connect(mg);
    const car = mkOsc(R, o.wave || 'sine', f, t, end, 0), osc = [car, mod];
    mg.connect(car.frequency); car.connect(g);
    if (o.det) {
      const c2 = mkOsc(R, o.wave || 'sine', f, t, end, o.det), g2 = ctx.createGain();
      g2.gain.value = 0.7; mg.connect(c2.frequency); c2.connect(g2); g2.connect(g); osc.push(c2);
    }
    if (o.oct) {
      const p = mkOsc(R, 'sine', f * 2, t, end, o.octDet || 0), pg = ctx.createGain();
      pg.gain.setValueAtTime(o.oct, t); pg.gain.setTargetAtTime(0, t, o.octTc || 0.09);
      p.connect(pg); pg.connect(g);
    }
    if (o.vib && dur > (o.vibDelay || 0.2) + 0.08) vibrato(R, t, end, o.vibRate || 5.6, o.vib, o.vibDelay || 0.2, osc);
    g.connect(dest);
    return g;
  }
  // chord of saws (alternately detuned): short = off-beat stab, long + slow attack = pad
  function vChord(R, dest, t, notes, dur, vel, o) {
    const ctx = R.ctx, a = o.a || 0.004, rTc = o.rTc || 0.03;
    const tOff = Math.max(t + dur, t + a + 0.005), end = tOff + rTc * 7 + 0.02;
    const g = ctx.createGain();
    adsr(g.gain, t, tOff, a, vel, o.dTc || 0.05, o.sus == null ? 0.6 : o.sus, rTc);
    for (let i = 0; i < notes.length; i++) mkOsc(R, o.wave || 'sawtooth', mtof(notes[i]), t, end, (i & 1 ? -1 : 1) * (o.det || 7)).connect(g);
    g.connect(dest);
  }

  // instrument presets
  const P = {
    lead: { wave: 'p25', mix2: 0.4, det: 10, a: 0.006, dTc: 0.07, sus: 0.72, rTc: 0.03, vib: 11, vibDelay: 0.17 },
    lead2: { wave: 'p12', mix2: 0, a: 0.006, dTc: 0.07, sus: 0.7, rTc: 0.03, vib: 8, vibDelay: 0.2 },
    brass: { ratio: 1, i0: 3.3, i1: 1.45, iTc: 0.08, a: 0.014, dTc: 0.12, sus: 0.82, rTc: 0.04, det: 7, vib: 9, vibDelay: 0.22 },
    flute: { ratio: 1, i0: 1.3, i1: 0.45, iTc: 0.06, a: 0.03, dTc: 0.2, sus: 0.85, rTc: 0.07, det: 5, vib: 10, vibDelay: 0.26 },
    pan: { ratio: 2, mdet: 7, i0: 2.3, i1: 0.22, iTc: 0.05, a: 0.003, dTc: 0.17, sus: 0.1, rTc: 0.09, oct: 0.42, octTc: 0.1 },
    bell: { ratio: 3.5, i0: 1.6, i1: 0.1, iTc: 0.09, a: 0.002, dTc: 0.22, sus: 0, rTc: 0.12, oct: 0.3, octTc: 0.2 },
    bass: { ratio: 1, i0: 3.2, i1: 0.85, iTc: 0.055, a: 0.004, dTc: 0.14, sus: 0.72, rTc: 0.028 },
    stab: { a: 0.004, dTc: 0.05, sus: 0.55, rTc: 0.03, det: 8 },
    pad: { a: 0.09, dTc: 0.4, sus: 0.8, rTc: 0.13, det: 6 },
  };

  // ------------------------------------------------------------------ drums
  function dKick(R, dest, t, v) {
    const ctx = R.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(46, t + 0.1);
    g.gain.setValueAtTime(v, t); g.gain.setTargetAtTime(0, t + 0.05, 0.045);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.42);

    const ctx = R.ctx, n = noiseSrc(R, t, open ? 0.32 : 0.07), g = ctx.createGain();
    g.gain.setValueAtTime(v, t); g.gain.setTargetAtTime(0, t + (open ? 0.02 : 0.002), open ? 0.06 : 0.011);
    n.connect(g); g.connect(B.hatF);
  }

    const ctx = R.ctx, n = noiseSrc(R, t, 0.08), g = ctx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.012); g.gain.setTargetAtTime(0, t + 0.012, 0.014);

    o.frequency.setValueAtTime(f * (bend || 1.5), t); o.frequency.exponentialRampToValueAtTime(f, t + 0.05);
    g.gain.setValueAtTime(v, t); g.gain.setTargetAtTime(0, t + 0.02, tc || 0.07);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.03 + (tc || 0.07) * 8);
  }
  function dRim(R, dest, t, v) {
    const ctx = R.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(1760, t);
    g.gain.setValueAtTime(v, t); g.gain.setTargetAtTime(0, t + 0.004, 0.011);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.12);
  }
  function dCrash(R, dest, t, v) {
    const ctx = R.ctx, n = noiseSrc(R, t, 1.4), g = ctx.createGain(), f = ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 4200;
    g.gain.setValueAtTime(v, t); g.gain.setTargetAtTime(0, t + 0.03, 0.26);
    n.connect(f); f.connect(g); g.connect(dest);

  // Melodic lines:  <pitch>:<steps>  (c4 = middle C, # sharp, b flat) · r:<n> rest · ~:<n> tie (extends the

  const SONGS = {
    // ---- Emerald Coast: sunny calypso-pop in Bb, 132 bpm.  intro(2) | A A' B B' C (40 bars, ~73 s) loop
    level: {
      bpm: 132, tr: -2, swing: 0.08, echo: 0.3, loop: 'A1', order: ['I1', 'I2', 'A1', 'A2', 'B1', 'B2', 'C'],

        // A: the hook — tresillo (3-3-2) arpeggio up, stepwise answer down; sequence on IV and V; climax bar 5

            'b5:3 a5:3 g5:2 d6:4 r:1 g5:1 b5:1 d6:1 | e6:3 d6:3 c6:2 g5:2 a5:2 c6:4 | e6:3 d6:3 c6:2 a5:4 r:2 a5:2 | ' +
            'd6:3 c6:3 a5:2 b5:3 a5:3 g5:2 | c6:6 r:10',
          pan: '% | %:8 c6:1 e6:1 g6:2 e6:1 c6:1 g5:2 | % | %:8 b5:1 d6:1 g6:2 d6:2 r:2 | % | % | % | ' +

    I1: { h: 'x.-.x.-.x.-.x.-.', c: '...h..l....h..l.' },
    I2: { k: 'x...x...x.......', h: 'x.-.x.-.........', s: '........x.xx....', t: '............1123' },
    A: { k: 'x.....x.x..x....', s: '....X.......X...', h: 'x.-.x.-.x.-.x.o.', c: '...h..l....h.ll.' },
    A2: { k: 'x.....x.x.x.....', s: '....X.......X..-', h: 'x.-.x.-.x.-.x.o.', c: '...h..l....h.ll.' },
    Af: { k: 'x.....x.x.......', s: '....X.....x.xx..', h: 'x.-.x.-.x.......', c: '...h..l.........', t: '..............23' },
    B: { k: 'x...x...x...x...', s: '....X.......X...', h: '..o...o...o...o.', m: 'x-x-x-x-x-x-x-x-' },
    Bf: { k: 'x...x...x...x...', s: '....X.......-xxX', h: '..o...o...o.....', m: 'x-x-x-x-x-x-....' },
    Bg: { k: 'X..x..x.X..x..x.', s: '....X.......X...', h: 'x.x.x.x.x.x.x.x.', C: 'x.......x.......' },
    Bh: { k: 'X.....x.........', s: '........x..x....', t: '............1223', C: 'X...............', m: 'x-x-x-x-........' },
    C: { k: 'x.........x.....', r: 'x..x..x...x.x...', m: 'x-xxx-xxx-xxx-xx', c: '..h...l...h..ll.' },
    Cf: { k: 'x...x...x...x...', s: '....-...-.-.xxXX', m: 'x-xxx-xxx-xx....', c: '..h...l...h.....', t: '..............3.' },
    T: { k: 'x.........x.....', r: '....x.......x...', m: 'x.-.x.-.x.-.x.-.', c: '...h..l....h..l.' },
    J1: { k: '...x.......x....', s: 'xxx.....xxx.....', t: '...3.......3....' },
    J2: { k: '...x....X.......', s: 'xxx...-x........', t: '...3....3.......', C: '........X.......' },
    J3: {},
